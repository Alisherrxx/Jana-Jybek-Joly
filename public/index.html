/* Quiet luxury: warm stone ground, ivory cards, espresso ink; bronze only as hairline accent. Cormorant Garamond for names & figures, Jost for UI */
:root{
  --bg:#f4f0e8; --bg-2:#ece6da; --surface:#fffdf9; --surface-2:#f8f4ec; --surface-3:#efe8db; --ink:#26221c; --ink-2:#3d362c; --muted:#8a8275; --line:rgba(38,34,28,.09); --line-2:rgba(38,34,28,.17);
  --bronze:#8a6d3b; --bronze-soft:rgba(138,109,59,.10); --gold:#8a6d3b; --gold-2:#6f5730; --accent:#26221c; --accent-ink:#fbf8f2; --accent-soft:rgba(38,34,28,.06); --brass:#8a6d3b;
  --booked:#3d5f8f; --booked-bg:#e8edf4; --in:#3f6f55; --in-bg:#e6efe8; --out:#857d70; --out-bg:#efece6;
  --warn:#9c6326; --warn-bg:#f5ebdd; --bad:#9e3f37; --bad-bg:#f6e6e3; --insp:#6a5590; --insp-bg:#eee9f4;
  --weekend:rgba(38,34,28,.022); --today:rgba(138,109,59,.07); --floor-bg:#ebe4d7; --floor-ink:#26221c;
  --t-grid:#3f6f55; --t-today:#3d5f8f; --t-list:#6a5590; --t-rooms:#9c6326; --t-hk:#8f4a64; --t-report:#3c7480; --t-log:#6b655b; --t-staff:#8a6d3b;
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --f-mono:"Jost",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0;letter-spacing:.01em}
.brand h1 span{color:var(--brass)}
.brand h1.logo{font-family:"Marcellus","Cormorant Garamond",Georgia,serif;font-weight:400;font-size:26px;letter-spacing:.08em;line-height:1.1;
  background:linear-gradient(100deg,#8a6216 0%,#d9a93c 35%,#f3d27a 50%,#c8922b 65%,#8a6216 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
@media (max-width:560px){.brand h1.logo{font-size:21px}}
.who{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:4px 12px}
nav.tabs button{--tc:var(--accent);border:2px solid color-mix(in srgb,var(--tc) 35%,transparent);background:color-mix(in srgb,var(--tc) 10%,var(--surface));color:var(--tc);
  padding:8px 16px;border-radius:999px;font-family:var(--f-display);font-weight:500;font-size:13.5px;letter-spacing:.02em;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s,color .15s}
nav.tabs button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tc)}
nav.tabs button:hover{background:color-mix(in srgb,var(--tc) 20%,var(--surface))}
nav.tabs button[aria-selected="true"]{background:var(--tc);color:#fff;border-color:var(--tc);box-shadow:0 4px 12px color-mix(in srgb,var(--tc) 35%,transparent)}
nav.tabs button[aria-selected="true"]::before{background:#fff}
nav.tabs button[data-tab="grid"]{--tc:var(--t-grid)} nav.tabs button[data-tab="today"]{--tc:var(--t-today)} nav.tabs button[data-tab="list"]{--tc:var(--t-list)}
nav.tabs button[data-tab="rooms"]{--tc:var(--t-rooms)} nav.tabs button[data-tab="hk"]{--tc:var(--t-hk)} nav.tabs button[data-tab="report"]{--tc:var(--t-report)}
nav.tabs button[data-tab="log"]{--tc:var(--t-log)} nav.tabs button[data-tab="staff"]{--tc:var(--t-staff)}
#app{--tc:var(--accent)} #app[data-tab="grid"]{--tc:var(--t-grid)} #app[data-tab="today"]{--tc:var(--t-today)} #app[data-tab="list"]{--tc:var(--t-list)} #app[data-tab="rooms"]{--tc:var(--t-rooms)}
#app[data-tab="hk"]{--tc:var(--t-hk)} #app[data-tab="report"]{--tc:var(--t-report)} #app[data-tab="log"]{--tc:var(--t-log)} #app[data-tab="staff"]{--tc:var(--t-staff)}
nav.tabs button:focus-visible,.btn:focus-visible,.cell-empty:focus-visible,.bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:16px}
.toolbar .grow{flex:1}
.toolbar input[type=date],.toolbar input[type=month],.toolbar input[type=search],.toolbar select{border:1px solid var(--line);background:var(--surface);padding:7px 10px;border-radius:8px}
.notice{padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-weight:500;margin-top:16px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}

/* grid */
.grid-frame{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:44px;padding:0}
.grid thead th{position:sticky;top:0;background:var(--surface-2);font-weight:500;font-size:13px;color:var(--muted);width:64px;min-width:64px;text-align:center;line-height:1.15;padding:6px 2px}
.grid thead th b{display:block;font-size:15px;color:var(--ink);font-family:var(--f-mono)}
.grid .rm{position:sticky;left:0;z-index:2;background:var(--surface);min-width:96px;width:96px;padding:4px 10px;text-align:left}
.grid thead .rm{z-index:3;background:var(--surface-2)}
.rm .no{font-family:var(--f-mono);font-weight:500;font-size:15px;display:flex;align-items:center;gap:6px}
.rm .ty{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.hk{width:8px;height:8px;border-radius:50%;display:inline-block}
.hk.clean{background:var(--in)} .hk.dirty{background:var(--warn)} .hk.repair{background:var(--bad)} .hk.cleaning{background:var(--booked)} .hk.inspect{background:var(--insp)}
.legend i.hk{width:12px;height:12px;border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--muted)} .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .chip.ghost{background:none;color:var(--muted)}
.chip:focus-visible,.hk-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips .range{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.chips .range input{width:70px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
.hkb.dirty{color:var(--warn);border-color:var(--warn)} .hkb.cleaning{color:var(--booked);border-color:var(--booked)} .hkb.inspect{color:var(--insp);border-color:var(--insp)} .hkb.clean{background:var(--in);color:#fff;border-color:var(--in)} .hkb.repair{color:var(--bad);border-color:var(--bad)}
.hk-bar{margin-top:16px} .hk-bar h2{margin-bottom:8px}
.hk-floor{margin:18px 0 8px;padding:8px 12px;border-radius:8px;background:var(--floor-bg);color:var(--floor-ink);font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-left:4px solid var(--floor-ink)}
.hk-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.hk-card{display:flex;flex-direction:column;gap:2px;text-align:left;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);cursor:pointer;min-width:0;border-left-width:6px}
.hk-card .n{font-family:var(--f-mono);font-size:18px;font-weight:500;color:var(--ink)} .hk-card .s{font-size:13px;font-weight:700} .hk-card .w,.hk-card .t{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hk-card.clean{border-left-color:var(--in)} .hk-card.clean .s{color:var(--in)}
.hk-card.dirty{border-left-color:var(--warn);background:var(--warn-bg)} .hk-card.dirty .s{color:var(--warn)}
.hk-card.cleaning{border-left-color:var(--booked);background:var(--booked-bg)} .hk-card.cleaning .s{color:var(--booked)}
.hk-card.inspect{border-left-color:var(--insp);background:var(--insp-bg)} .hk-card.inspect .s{color:var(--insp)}
.hk-card.repair{border-left-color:var(--bad);background:var(--bad-bg)} .hk-card.repair .s{color:var(--bad)}
.hk-card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)} .hk-card.sel .n::after{content:" ✓";color:var(--accent)}
.stat.hk-st{border-left:5px solid var(--line)} .stat.hk-st.dirty{border-left-color:var(--warn)} .stat.hk-st.cleaning{border-left-color:var(--booked)} .stat.hk-st.inspect{border-left-color:var(--insp)} .stat.hk-st.clean{border-left-color:var(--in)}
.pill.hkp.dirty{background:var(--warn-bg);color:var(--warn)} .pill.hkp.cleaning{background:var(--booked-bg);color:var(--booked)} .pill.hkp.inspect{background:var(--insp-bg);color:var(--insp)} .pill.hkp.done{background:var(--in-bg);color:var(--in)} .pill.hkp.cancelled{background:var(--out-bg);color:var(--out)}
.warnbox{background:var(--warn-bg);color:var(--warn)}
.grid tr.floor td{height:34px;background:var(--floor-bg);color:var(--floor-ink);font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:0 12px;font-weight:700;border-top:2px solid var(--floor-ink);border-bottom:2px solid var(--floor-ink)}
.grid tr.floor td.rm{background:var(--floor-bg);font-family:var(--f-display);font-weight:700;white-space:nowrap}
.grid thead th.nav{width:34px;min-width:34px;padding:0}
.grid thead th.nav button{width:100%;height:100%;min-height:52px;border:0;background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.grid thead th.nav button:hover{background:var(--accent);color:var(--accent-ink)}
.grid td.g-free{background:var(--in-bg);color:var(--in);font-size:12px;font-weight:600;text-align:center} .grid td.g-x{background:var(--surface-2)}
.grid td.navpad{width:34px;min-width:34px;background:var(--surface-2)}
.grid .we{background:var(--weekend)}
.grid .td{background:var(--today)}
.cell-empty{cursor:pointer}
.cell-empty:hover{background:var(--accent-soft)}
.cell-empty.ro{cursor:default}.cell-empty.ro:hover{background:inherit}
.bar{display:flex;align-items:center;gap:4px;margin:5px 3px;height:34px;padding:0 8px;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer;overflow:hidden;white-space:nowrap;border:0;width:calc(100% - 6px);text-align:left}
.bar span{overflow:hidden;text-overflow:ellipsis}
.bar.booked{background:var(--booked-bg);color:var(--booked);box-shadow:inset 3px 0 0 var(--booked)}
.bar.in{background:var(--in-bg);color:var(--in);box-shadow:inset 3px 0 0 var(--in)}
.bar.out{background:var(--out-bg);color:var(--out);box-shadow:inset 3px 0 0 var(--out)}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0;box-shadow:none}
.bar .debt{flex:none;width:7px;height:7px;border-radius:50%;background:var(--bad)}

/* cards & lists */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--tc,var(--accent));margin:0 0 12px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-left:10px;border-left:4px solid var(--tc,var(--accent))}
.panel{border-top:3px solid color-mix(in srgb,var(--tc,var(--accent)) 55%,transparent)}
.panel h2 b{font-family:var(--f-mono);color:var(--ink);letter-spacing:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .k{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:var(--f-display);font-size:24px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .s{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:160px;cursor:pointer}
.row .main b{display:block}
.row .sub{font-size:13px;color:var(--muted)}
.room-tag{font-family:var(--f-mono);font-weight:500;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:14px}
.pill{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}

/* ===== grid: clear structure ===== */
.grid-frame{border:1px solid rgba(38,34,28,.22)}
.grid th,.grid td{border-right:1px solid rgba(38,34,28,.13);border-bottom:1px solid rgba(38,34,28,.13)}
.grid thead th{background:#ebe5da;color:#5f574a;border-bottom:2px solid rgba(38,34,28,.35);border-right:1px solid rgba(38,34,28,.16)}
.grid thead th b{color:var(--ink)}
.grid thead th.we{background:#e4ddcf}
.grid thead th.td{background:var(--ink);color:rgba(251,248,242,.75)}
.grid .rm,.grid thead .rm{background:#f3efe7;border-right:2px solid rgba(38,34,28,.28)}
.grid tbody tr:not(.floor):nth-child(even) td:not(.rm){background-color:#faf8f3}
.grid tbody tr:not(.floor):nth-child(odd) td:not(.rm){background-color:#fffefb}
.grid tbody td.we{background-color:#f3eee4!important}
.grid tbody td.td{background-color:#f6ecd8!important;box-shadow:inset 1px 0 0 rgba(38,34,28,.45),inset -1px 0 0 rgba(38,34,28,.45)}
.grid tbody tr:not(.floor):hover td:not(.rm){background-color:#efe9dd!important}
.grid tbody tr:not(.floor):hover td.rm{background:#e9e2d4}
.grid td.cell-empty{position:relative;cursor:pointer}
.grid td.cell-empty:hover{background-color:#e3dac8!important;box-shadow:inset 0 0 0 2px var(--ink)}
.grid td.cell-empty:hover::after{content:"+";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:300;color:var(--ink)}
.grid thead th.colhl{background:#d9cfbd;color:var(--ink)}
.grid tbody td.colhl:not(.rm){background-color:#efe9dd!important}
.grid tr.floor td,.grid tr.floor td.rm{background:#ddd5c6;border-top:2px solid rgba(38,34,28,.4);border-bottom:1px solid rgba(38,34,28,.25)}
.grid td.navpad{background:#f3efe7!important}
.grid thead th.nav{background:#e4ddcf}
.grid tbody tr:not(.floor) td.cell-empty:hover,.grid tbody tr:not(.floor) td.cell-empty.colhl:hover{background-color:#ddd2bd!important}

/* ---- language switch ---- */
.brand-r{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.lang{display:inline-flex;border:1px solid rgba(38,34,28,.22);border-radius:999px;padding:2px;background:rgba(255,253,249,.7)}
.lang button{all:unset;cursor:pointer;font:500 12px/1 var(--f-body);letter-spacing:.08em;padding:6px 11px;border-radius:999px;color:var(--muted)}
.lang button.on{background:var(--ink);color:#fffdf9}
.lang button:focus-visible{outline:2px solid var(--bronze);outline-offset:1px}
body.auth .lang{position:fixed;top:16px;right:16px;z-index:5}
@media (max-width:760px){body.auth .lang{top:auto;bottom:16px;right:50%;transform:translateX(50%)}}

/* ---- grid: arrows always visible ---- */
.grid thead th.nav,.grid td.navpad{position:sticky;z-index:3}
.grid thead th.nav{z-index:6}
.grid thead th.nav:nth-child(2),.grid tr>td.navpad:nth-child(2){left:var(--rmw,96px)}
.grid thead th.nav:last-child,.grid tr>td.navpad:last-child{right:0}
.grid thead th.nav{background:#f3efe7!important}
.grid thead th.nav:last-child,.grid tr>td.navpad:last-child{box-shadow:-1px 0 0 rgba(38,34,28,.18)}

/* ---- grid zoom ---- */
.zoom{display:inline-flex;align-items:center;border:1px solid rgba(38,34,28,.25);border-radius:999px;background:var(--surface);overflow:hidden}
.zoom button{all:unset;cursor:pointer;width:38px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;color:var(--ink)}
.zoom button:hover{background:var(--ink);color:#fbf8f2}
.zoom button:disabled{opacity:.3;cursor:default;background:none;color:var(--ink)}
.zoom span{min-width:74px;text-align:center;font-size:13px;font-weight:500;color:var(--ink);border-left:1px solid rgba(38,34,28,.15);border-right:1px solid rgba(38,34,28,.15);padding:0 6px;line-height:36px;white-space:nowrap}
table.grid.fx{table-layout:fixed;min-width:0}
.grid.fx th,.grid.fx td{box-sizing:border-box}
.grid.fx thead th:not(.rm):not(.nav){width:var(--dw);min-width:0;padding:6px 0;overflow:hidden}
.grid.fx .rm{width:104px;min-width:104px;max-width:104px;overflow:hidden}
.grid.fx thead th.nav,.grid.fx td.navpad{width:34px;min-width:34px}
.grid thead th i{font-style:normal;display:block;white-space:nowrap}
.grid.z-m thead th b{font-size:19px}
.grid.z-m .bar{font-size:12px;padding:0 6px;margin:5px 2px;width:calc(100% - 4px)}
.grid.z-s thead th{letter-spacing:0;font-size:11px}
.grid.z-s thead th b{font-size:15px;margin:1px 0}
.grid.z-s thead th .mo{visibility:hidden}
.grid.z-s thead th.m1 .mo{visibility:visible;overflow:visible}
.grid.z-s th,.grid.z-s td{height:40px}
.grid.z-s .bar{font-size:11px;height:28px;padding:0 4px;margin:6px 1px;width:calc(100% - 2px);border-radius:5px;letter-spacing:0}
.grid.z-s td.g-free{font-size:0}
.grid.z-s td.cell-empty:hover::after{font-size:14px}
html[lang="zh-Hans"] .grid.z-s thead th{font-size:12px}
/* ---- housekeeping: one-tap tiles ---- */

async function fetchLog(from,toEx){
  const s=await fdb.collection('log').where('at','>=',new Date(P(from)-5*36e5)).where('at','<',new Date(P(toEx)-5*36e5)).orderBy('at','desc').limit(1000).get();
  return s.docs.map(d=>({id:d.id,...d.data()}));
}

function openRoom(r){
  const isNew=!r.id,prev=isNew?null:r;r=Object.assign({floor:2,type:'Стандарт',capacity:2,price:15000,hk:'clean',active:true},r);
  mroot.innerHTML=`<div class="scrim" id="scrim"><form class="modal" id="rf" style="max-width:480px"><h3>${isNew?'Новый номер':'Номер '+esc(r.number)}</h3>
  <div class="form">
    <label>Номер комнаты<input id="r-no" value="${esc(r.number||'')}" required placeholder="201"></label>
    <label>Этаж<input id="r-fl" type="number" value="${esc(r.floor)}"></label>
    <label>Тип<input id="r-ty" list="r-types" value="${esc(r.type)}"><datalist id="r-types">${ROOM_TYPES.map(t=>`<option>${esc(t)}</option>`).join('')}</datalist></label>
    <label>Мест<input id="r-cap" type="number" min="1" value="${esc(r.capacity)}"></label>
    <label>Цена за ночь, ₸<input id="r-pr" type="number" min="0" step="500" value="${esc(r.price)}"></label>
    <label>Продаётся<select id="r-ac"><option value="1"${r.active!==false?' selected':''}>Да</option><option value="0"${r.active===false?' selected':''}>Нет (скрыт из шахматки)</option></select></label>
    <label class="full">Заметка<input id="r-nt" value="${esc(r.note||'')}" placeholder="Вид во двор, ванна…"></label>
    <div class="err" id="r-err" hidden></div>
  </div><div class="actions"><div class="l">${!isNew&&can.owner()?'<button type="button" class="btn danger" id="r-del">Удалить</button>':''}</div><div class="r"><button type="button" class="btn" id="r-close">Закрыть</button><button class="btn primary">Сохранить</button></div></div></form></div>`;
  const $=id=>document.getElementById(id);
  $('r-close').onclick=close;$('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')close()});
  const fail=t=>{$('r-err').textContent=t;$('r-err').hidden=false};
  $('rf').addEventListener('submit',async e=>{e.preventDefault();
    const d={number:$('r-no').value.trim(),floor:+$('r-fl').value||0,type:$('r-ty').value.trim(),capacity:+$('r-cap').value||1,price:+$('r-pr').value||0,active:$('r-ac').value==='1',note:$('r-nt').value.trim(),hk:r.hk||'clean'};
    if(!d.number)return fail('Укажите номер комнаты.');
    if(rooms.some(x=>x.id!==r.id&&String(x.number)===d.number))return fail('Номер '+d.number+' уже есть.');
    try{await writeRoom(prev,d,isNew?'create':'update');close();toast('Номер сохранён')}catch(err){fail('Не удалось сохранить: '+errText(err))}});
  if($('r-del'))$('r-del').onclick=()=>{
    if(allB().some(b=>b.roomId===r.id&&live(b)))return fail('По этому номеру есть брони. Сделайте его «Не продаётся» вместо удаления.');
    ask('Удалить номер '+esc(r.number)+'?','Удалить',async()=>{try{await deleteRoom(prev);close();toast('Номер удалён')}catch(err){fail(errText(err))}})};
}

/* ---------- Excel ---------- */
function autosize(rows){return rows[0].map((_,i)=>({wch:Math.min(45,Math.max(8,...rows.map(r=>String(r[i]??'').length+2)))}))}
function saveXlsx(name,sheets){if(!window.XLSX){toast('Модуль Excel не загрузился. Проверьте интернет и обновите страницу.');return}
  const wb=XLSX.utils.book_new();sheets.forEach(([n,rows])=>{if(LANG==='zh'){n=trText(n).slice(0,31);rows=rows.map((r,ri)=>r.map(c=>{if(typeof c!=='string')return c;const v=trText(c);return ri===0||!/[А-Яа-яЁё]/.test(v)?v:c}))}const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=autosize(rows);XLSX.utils.book_append_sheet(wb,ws,n)});XLSX.writeFile(wb,name)}
const BH=['Бронь','Номер','Тип','Гость','Телефон','Документ','Компания','Гостей','Заезд','Выезд','Ночей','Цена/ночь','Сумма','Оплачено','Долг','Способ оплаты','Источник','Статус','Комментарий','Создал(а)','Создано','Изменил(а)','Изменено'];
const bRowX=b=>{const r=roomById(b.roomId)||{};return[ref(b.id),r.number||'?',r.type||'',b.guest||'',b.phone||'',b.doc||'',b.company||'',b.guests||'',dmy(b.checkIn),dmy(b.checkOut),nights(b),+b.price||0,total(b),+b.paid||0,live(b)?debt(b):0,b.payMethod||'',b.source||'',STATUS[b.status]||b.status,b.note||'',b.createdByName||staffName(b.createdBy)||'',stamp(b.createdAt),b.updatedByName||staffName(b.updatedBy)||'',stamp(b.updatedAt)]};
const logRows=ls=>[['Время','Сотрудник','Действие','Изменения'],...ls.map(l=>[stamp(l.at),l.byName||staffName(l.by),l.text,(l.changes||[]).map(c=>`${c.f}: ${c.from||'—'} → ${c.to||'—'}`).join('; ')])];
async function doExport(btn){
  const from=st.exFrom,to=st.exTo;if(!from||!to||to<from){toast('Проверьте даты периода.');return}
  btn.disabled=true;btn.textContent='Готовим файл…';
  try{
    await loadHist(true);const toEx=add(to,1),list=allB(),S=periodStats(list,from,toEx);
    const inP=list.filter(b=>b.checkIn<toEx&&b.checkOut>from).sort((a,b)=>a.checkIn.localeCompare(b.checkIn));
    const sum=[['Показатель','Значение'],['Период',dmy(from)+' – '+dmy(to)],['Номеров в продаже',sortedRooms().length],['Проданных ночей',S.nts],['Загрузка, %',S.occ],['Выручка (по прожитым ночам), ₸',S.rev],['Средняя цена ночи, ₸',Math.round(S.adr)],['Заездов',S.arrivals.length],['Оплачено по заездам периода, ₸',S.paid],['Долг по заездам периода, ₸',S.owe],['Отменено броней',inP.filter(b=>b.status==='cancelled').length],[],['Выгрузил(а)',me.name],['Дата выгрузки',stamp(new Date())]];
    const pays=[['Способ оплаты','Оплачено, ₸'],...Object.entries(S.byPay)];
    const byDay={};S.arrivals.forEach(b=>{byDay[b.checkIn]=byDay[b.checkIn]||{};const p=b.payMethod||'—';byDay[b.checkIn][p]=(byDay[b.checkIn][p]||0)+(+b.paid||0)});
    const pm=[...new Set(S.arrivals.map(b=>b.payMethod||'—'))];
    pays.push([],['По дням заезда',...pm,'Итого']);Object.keys(byDay).sort().forEach(d=>{const row=pm.map(p=>byDay[d][p]||0);pays.push([dmy(d),...row,row.reduce((a,b)=>a+b,0)])});
    const rr=[['Номер','Тип','Этаж','Ночей продано','Загрузка, %','Выручка, ₸'],...sortedRooms().map(r=>{const x=S.byRoom[r.id]||{n:0,v:0};return[r.number,r.type||'',r.floor,x.n,S.days?Math.round(x.n/S.days*100):0,x.v]})];
    const debts=[BH,...list.filter(b=>live(b)&&debt(b)>0).sort((a,b)=>a.checkIn.localeCompare(b.checkIn)).map(bRowX)];
    const sheets=[['Сводка',sum],['Брони',[BH,...inP.map(bRowX)]],['Оплаты',pays],['По номерам',rr],['Долги',debts]];
    if(can.owner())sheets.push(['Журнал',logRows(await fetchLog(from,toEx))]);
    saveXlsx(`Отчёт ${dmy(from)}-${dmy(to)}.xlsx`,sheets);toast('Файл скачан');
  }catch(e){toast('Не удалось выгрузить: '+errText(e))}
  btn.disabled=false;render();
}
async function doBackup(btn){
  btn.disabled=true;btn.textContent='Готовим копию…';
  try{await loadHist(true);const ls=(await fdb.collection('log').orderBy('at','desc').get()).docs.map(d=>({id:d.id,...d.data()}));
    saveXlsx(`Копия базы ${dmy(today())}.xlsx`,[
      ['Номера',[['Номер','Этаж','Тип','Мест','Цена/ночь','Продаётся','Состояние','Заметка'],...sortedRooms(true).map(r=>[r.number,r.floor,r.type||'',r.capacity||'',+r.price||0,r.active===false?'Нет':'Да',HK3[hkS(r)],r.note||''])]],
      ['Брони',[BH,...allB().sort((a,b)=>a.checkIn.localeCompare(b.checkIn)).map(bRowX)]],
      ['Сотрудники',[['Логин / email','Имя','Роль','Активен'],[OWNER,'Главный владелец','Владелец','Да'],...staffList.map(s=>[showId(s.id),s.name||'',ROLES[s.role]||s.role,s.active===false?'Нет':'Да'])]],
      ['Журнал',logRows(ls)]]);toast('Копия скачана');
  }catch(e){toast('Не удалось: '+errText(e))}
  btn.disabled=false;btn.textContent='Полная копия базы';
}

    try{for(const p of plan)await writeRoom(null,p.d,'create',p.id);toast('Номера созданы')}catch(err){el.disabled=false;toast('Не удалось: '+errText(err))}}

  if(a==='staffactive'&&can.owner()){const s=staffList.find(x=>x.id===el.dataset.id);if(!s)return;const d={name:s.name||'',role:s.role,active:s.active===false,ack:true};

app.addEventListener('submit',async e=>{
  if(e.target.id==='sf'){e.preventDefault();const raw=document.getElementById('s-login').value.trim().toLowerCase(),name=document.getElementById('s-name').value.trim(),role=document.getElementById('s-role').value,pw=document.getElementById('s-pass').value,er=document.getElementById('s-err');

    let em;
    if(raw.includes('@')){if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(raw))return fail('Проверьте email.');em=raw}
    else{if(!LOGIN_RE.test(raw))return fail('Логин: от 3 до 30 латинских букв или цифр, можно точку, дефис и _.');if(pw.length<6)return fail('Пароль — минимум 6 символов.');em=toEmail(raw)}

/* ---------- room finder ---------- */
const blocks=b=>b.status==='booked'||b.status==='in';
const clash=(list,roomId,ci,co,exceptId)=>list.find(x=>x.id!==exceptId&&blocks(x)&&x.roomId===roomId&&x.checkIn<co&&ci<x.checkOut);
async function serverClash(roomId,ci,co,exceptId){
  const s=await fdb.collection('bookings').where('roomId','==',roomId).get();
  return clash(s.docs.map(d=>({id:d.id,...d.data()})),roomId,ci,co,exceptId);
}
function findRooms(f){
  return sortedRooms().filter(r=>r.hk!=='repair'&&(+r.capacity||0)>=f.guests&&(!f.type||r.type===f.type)&&(!f.floor||String(r.floor)===f.floor)&&!clash(allB(),r.id,f.ci,f.co,f.except));
}
function openFinder(init,onPick){
  const rs=sortedRooms(),types=[...new Set(rs.map(r=>r.type).filter(Boolean))],floors=[...new Set(rs.map(r=>String(r.floor)))];
  const t=today(),f=Object.assign({ci:t,co:add(t,1),guests:1,type:'',floor:'',except:''},init||{});
  document.getElementById('finder')?.remove();
  mroot.insertAdjacentHTML('beforeend',`<div class="scrim" id="finder"><div class="modal" style="max-width:720px">
    <h3>Подобрать номер</h3>
    <div class="form">
      <label>Заезд<input type="date" id="q-in" value="${f.ci}" required></label>
      <label>Выезд<input type="date" id="q-out" value="${f.co}" required></label>
      <label>Гостей<input type="number" id="q-g" min="1" max="20" value="${f.guests}"></label>
      <label>Тип номера<select id="q-type"><option value="">Любой</option>${types.map(x=>`<option${x===f.type?' selected':''}>${esc(x)}</option>`).join('')}</select></label>
      <label>Этаж<select id="q-floor"><option value="">Любой</option>${floors.map(x=>`<option value="${esc(x)}"${x===f.floor?' selected':''}>${esc(x)}</option>`).join('')}</select></label>
      <div class="err" id="q-err" hidden></div>
    </div>
    <div id="q-res" style="margin-top:14px"></div>
    <div class="actions"><span></span><div class="r"><button type="button" class="btn" id="q-close">Закрыть</button></div></div></div></div>`);
  const $=id=>document.getElementById(id),err=$('q-err');
  const run=()=>{
    f.ci=$('q-in').value;f.co=$('q-out').value;f.guests=Math.max(1,+$('q-g').value||1);f.type=$('q-type').value;f.floor=$('q-floor').value;
    err.hidden=true;
    if(!f.ci||!f.co){err.textContent='Укажите даты заезда и выезда.';err.hidden=false;$('q-res').innerHTML='';return}
    if(f.co<=f.ci){err.textContent='Дата выезда должна быть позже даты заезда.';err.hidden=false;$('q-res').innerHTML='';return}
    const n=diffD(f.ci,f.co),xs=findRooms(f);
    if(!xs.length){$('q-res').innerHTML=`<div class="empty"><b>На выбранные даты свободных номеров с такой вместимостью нет.</b><p class="muted" style="margin-bottom:0">Попробуйте другие даты, меньше гостей или другой тип номера.</p></div>`;return}

/* ---------- housekeeping ---------- */
let maids=[],openTasks=[],hkSel=new Set(),hkBusy=false,hkRep=null,hkRepLoading=false;
const OPEN_HK=['dirty','cleaning','inspect'];
const maidName=m=>m?[m.first,m.last].filter(Boolean).join(' '):'';
const maidById=id=>maids.find(m=>m.id===id);
const taskById=id=>openTasks.find(t=>t.id===id);
const hhmm=ms=>{if(!ms)return'';const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const dmyhm=ms=>{if(!ms)return'';const d=new Date(ms);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+' '+hhmm(ms)};
const mins=(a,b)=>a&&b?Math.max(0,Math.round((b-a)/60000)):null;
const HKACT={done:'Готово',dirty:'Нужна уборка',start:'Начала уборку',ready:'Готово — на проверку',accept:'Принято',ret:'Вернуть на доуборку',repair:'Ремонт',assign:'Назначена горничная'};

async function hkOne(r,action,maidId){
  const now=Date.now(),cur=r.hk||'clean',tk=r.hkTask?taskById(r.hkTask):null;
  const m=maidId?maidById(maidId):null;
  const tc=fdb.collection('cleanings');let tref=tk?tc.doc(tk.id):null,task=null,room={},text='';
  const ev=s=>({s,at:now,by:me.email,byName:me.name,maid:m?maidName(m):(tk&&tk.maidName)||''});
  const newTask=(status)=>{tref=tc.doc();return{roomId:r.id,room:String(r.number),floor:r.floor,status,maidId:m?m.id:'',maidName:m?maidName(m):'',t0:now,createdBy:me.email,createdByName:me.name,
    assignedAt:m?now:null,startedAt:status==='cleaning'?now:null,readyAt:null,doneAt:null,doneBy:'',doneByName:'',returns:0,events:[ev(status==='cleaning'?'start':'dirty')]}};
  const evs=x=>((tk&&tk.events)||[]).concat([x]);
  if(action==='unassign'){if(!tk||!OPEN_HK.includes(cur))return 'skip';task={maidId:'',maidName:'',events:evs(ev('unassign'))};room={hk:cur};text='горничная снята'}
  else if(action==='dirty'||action==='assign'){
    if(tk&&OPEN_HK.includes(cur)){if(!m)return 'skip';task={maidId:m.id,maidName:maidName(m),assignedAt:now,events:evs(ev('assign'))};room={hk:'dirty'};text=`назначена ${maidName(m)}`}
    else if(OPEN_HK.includes(cur)&&action==='dirty'&&!m)return 'skip';
    else{if(action==='assign'&&!m)return 'skip';task=newTask('dirty');room={hk:'dirty'};text=HKACT.dirty+(m?' → '+maidName(m):'')}
  }else if(action==='start'){
    if(cur==='cleaning')return 'skip';
    if(!tk||!OPEN_HK.includes(cur)){if(!m)return 'nomaid';task=newTask('cleaning');}
    else{const mid=m?m.id:tk.maidId;if(!mid)return 'nomaid';const mm=maidById(mid);task={status:'cleaning',startedAt:tk.startedAt||now,maidId:mid,maidName:mm?maidName(mm):tk.maidName,assignedAt:tk.assignedAt||now,events:evs(ev('start'))}}
    room={hk:'cleaning'};text=HKACT.start;
  }else if(action==='ready'){
    if(!tk||!['dirty','cleaning'].includes(cur))return 'skip';
    const mid=m?m.id:tk.maidId;if(!mid)return 'nomaid';const mm=maidById(mid);
    task={status:'inspect',readyAt:now,startedAt:tk.startedAt||tk.assignedAt||tk.t0,maidId:mid,maidName:mm?maidName(mm):tk.maidName,events:evs(ev('ready'))};room={hk:'inspect'};text=HKACT.ready;
  }else if(action==='accept'||action==='done'){
    if(cur==='clean')return 'skip';
    if(tk&&OPEN_HK.includes(cur)){if(action==='accept'&&cur!=='inspect'&&!can.manage())return 'notready';task={status:'done',doneAt:now,doneBy:me.email,doneByName:me.name,readyAt:tk.readyAt||now,events:evs(ev('accept'))}}
    room={hk:'clean',hkTask:null,hkMaid:'',hkMaidName:''};text=HKACT.accept;
  }else if(action==='ret'){
    if(!tk||cur!=='inspect')return 'skip';
    task={status:'cleaning',readyAt:null,returns:(tk.returns||0)+1,events:evs(ev('return'))};room={hk:'cleaning'};text=HKACT.ret;
  }else if(action==='repair'){
    if(cur==='repair')return 'skip';
    if(tk&&OPEN_HK.includes(cur))task={status:'cancelled',events:evs(ev('repair'))};
    room={hk:'repair',hkTask:null,hkMaid:'',hkMaidName:''};text=HKACT.repair;
  }
  if(task&&tref&&room.hkTask!==null){room.hkTask=tref.id;room.hkMaid=task.maidId!==undefined?task.maidId:(tk&&tk.maidId)||'';room.hkMaidName=task.maidName!==undefined?task.maidName:(tk&&tk.maidName)||''}
  room.hkAt=now;
  const lref=fdb.collection('log').doc();const b=fdb.batch();
  b.set(lref,{at:TS(),by:me.email,byName:me.name,kind:'hk',action:'hk-'+action,target:r.id,room:String(r.number),guest:'',text:`Уборка №${r.number}: ${text}`,changes:[{f:'Состояние',from:HK[cur]||cur,to:HK[room.hk]||room.hk}],payment:false});
  if(task&&tref)b.set(tref,task,{merge:true});
  b.set(fdb.collection('rooms').doc(r.id),Object.assign(room,{lastLog:lref.id,updatedBy:me.email,updatedAt:TS()}),{merge:true});
  await b.commit();return 'ok';
}
async function hkApply(ids,action,maidId,quiet){
  if(hkBusy)return;hkBusy=true;let ok=0,skip=0,nomaid=0,nr=0;
  try{for(const id of ids){const r=roomById(id);if(!r)continue;const res=await hkOne(r,action,maidId);if(res==='ok')ok++;else if(res==='nomaid')nomaid++;else if(res==='notready')nr++;else skip++}}
  catch(e){toast('Не удалось: '+errText(e))}
  hkBusy=false;
  if(!quiet){let msg=ok?`${HKACT[action]}: ${ok} ном.`:'Ничего не изменено';
    if(nomaid)msg+=` · ${nomaid} без горничной — выберите горничную`;
    if(nr)msg+=` · ${nr} ещё не готовы — сначала «Готово»`;
    if(skip&&!ok)msg+=' — для выбранных номеров это действие не подходит';
    toast(msg);if(ok){hkSel.clear();render()}}
}

async function hkSet(id,action,maidId){
  const r=roomById(id);if(!r||hkBusyIds.has(id))return;hkBusyIds.add(id);render();

}
function hkByMaid(){const by={};hkRep.forEach(t=>{const k=t.maidName||'— не назначена —';const o=by[k]=by[k]||{n:0,done:0,mins:[],rooms:[]};o.n++;if(t.status==='done')o.done++;const d=mins(t.assignedAt||t.t0,t.doneAt);if(d!==null&&t.status==='done')o.mins.push(d);o.rooms.push(t.room)});return by}

app.addEventListener('click',async e=>{
  const el=e.target.closest('[data-hk]');if(!el||!me||!can.book())return;const a=el.dataset.hk,v=el.dataset.v;
  if(a==='set'){const s3=el.dataset.s;if(s3==='repair'){const r=roomById(v);ask(`Отметить ремонт: №${r?r.number:''}? Номер не будет предлагаться для броней в подборе.`,'Ремонт',()=>hkSet(v,'repair'))}else hkSet(v,s3,s3==='dirty'?st.hkMaid:'');return}
  if(a==='filter'){st.hkF=v;render();return}
  if(a==='all'){const rs=sortedRooms().filter(r=>{const f=st.hkF||'all';return f==='all'||hkS(r)===f});const allOn=rs.every(r=>hkSel.has(r.id));rs.forEach(r=>allOn?hkSel.delete(r.id):hkSel.add(r.id));render();return}
  if(a==='toggle'){hkSel.has(v)?hkSel.delete(v):hkSel.add(v);render();return}
  if(a==='selfloor'){sortedRooms().filter(r=>String(r.floor)===v).forEach(r=>hkSel.add(r.id));render();return}
  if(a==='selst'){sortedRooms().filter(r=>hkS(r)===v).forEach(r=>hkSel.add(r.id));render();return}
  if(a==='selnone'){hkSel.clear();render();return}
  if(a==='selrange'){const f=+document.getElementById('hk-from').value,t=+document.getElementById('hk-to').value||f;if(!f){toast('Укажите номера, например с 201 по 206');return}
    const lo=Math.min(f,t),hi=Math.max(f,t);sortedRooms().filter(r=>+r.number>=lo&&+r.number<=hi).forEach(r=>hkSel.add(r.id));render();return}
  if(a==='maid'){st.hkMaid=st.hkMaid===v?'':v;render();return}
  if(a==='do'){if(!hkSel.size){toast('Сначала выберите номера');return}
    if(v==='repair'){const ids=[...hkSel];ask(`Отметить ремонт: ${ids.length} ном.?`,'Ремонт',()=>hkApply(ids,v,st.hkMaid));return}
    hkApply([...hkSel],v,st.hkMaid);return}
  if(a==='maidtoggle'){const m=maidById(v);if(!m)return;try{await fdb.collection('maids').doc(v).set({active:m.active===false},{merge:true})}catch(err){toast('Не удалось: '+errText(err))}return}
  if(a==='report'&&can.manage()){loadHkReport();return}

function skAgg(list){const by={},to={};let inSum=0,useSum=0,saleSum=0;
  list.filter(m=>!m.cancelled).forEach(m=>{const t=skMoveType(m);(m.lines||[]).forEach(l=>{const r=by[l.itemId]=by[l.itemId]||{name:l.name,in:0,out:0,sale:0,wo:0,lo:0,li:0,useSum:0};const n=+l.qty||0,c=+l.cost||0;
    if(t==='in'){r.in+=n;inSum+=n*c}
    if(t==='out'){r.out+=n;r.useSum+=n*c;useSum+=n*c;const k=m.to||'—';to[k]=to[k]||{};to[k][l.name]=(to[k][l.name]||0)+n}
    if(t==='sale'){r.sale+=n;r.useSum+=n*c;useSum+=n*c;saleSum+=n*(+l.price||0)}
    if(t==='writeoff'){r.wo+=n;r.useSum+=n*c;useSum+=n*c}
    if(t==='laundry_out')r.lo+=n;if(t==='laundry_in')r.li+=n})});
  return{inSum,useSum,saleSum,rows:Object.values(by).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ru')),to:Object.entries(to).map(([k,v])=>[k,Object.entries(v).map(([n,q])=>n+' ×'+skQty(q)).join(', ')])}}

function stockXls(){const R=skAgg(skRep);

    ['Остатки',[['Товар','Группа','Ед.','Остаток','Минимум','В прачечной','Закупочная цена','Цена продажи'],...stock.filter(x=>x.active!==false).map(x=>[x.name,SG[x.group]||'',x.unit||'',+x.qty||0,+x.min||0,+x.laundry||0,+x.cost||0,+x.price||0])]]]);

/* one batch = one operation: the move record, item balances and a journal line */
async function stockCommit(op,extra){
  const mref=fdb.collection('stockMoves').doc(),lref=fdb.collection('log').doc();
  const move=Object.assign({at:TS(),by:me.email,byName:me.name},op);
  const commitTo=b=>{b.set(mref,move);
    op.lines.forEach(l=>{const upd={qty:INC(l.delta||0),updatedAt:TS()};if(l.ldelta)upd.laundry=INC(l.ldelta);if(op.type==='in'&&l.cost)upd.cost=+l.cost;b.set(fdb.collection('stock').doc(l.itemId),upd,{merge:true})});
    b.set(lref,{at:TS(),by:me.email,byName:me.name,kind:'stock',action:'stock-'+op.type,target:mref.id,room:op.roomNo||'',guest:op.guest||'',text:`Склад — ${SOPV[skMoveType(op)]||op.type}: ${op.lines.map(l=>l.name+' ×'+skQty(Math.abs(op.type==='count'?l.delta:l.qty))).join(', ')}${op.supplier?' · от '+op.supplier:''}${op.to?' · → '+op.to:''}${op.reason?' · '+op.reason:''}${op.sum?' · '+tg(op.sum):''}`,changes:[],payment:false})};
  if(extra)await extra(mref.id,commitTo);
  else{const b=fdb.batch();commitTo(b);await b.commit()}
  return mref.id;
}
async function stockUndo(m){
  const apply=b=>{const lref=fdb.collection('log').doc();
    b.set(fdb.collection('stockMoves').doc(m.id),{cancelled:true,cancelledBy:me.email,cancelledAt:TS()},{merge:true});
    (m.lines||[]).forEach(l=>{const upd={qty:INC(-(l.delta||0)),updatedAt:TS()};if(l.ldelta)upd.laundry=INC(-l.ldelta);b.set(fdb.collection('stock').doc(l.itemId),upd,{merge:true})});
    b.set(lref,{at:TS(),by:me.email,byName:me.name,kind:'stock',action:'stock-undo',target:m.id,room:m.roomNo||'',guest:m.guest||'',text:`Склад — отменил(а) операцию «${SOPV[skMoveType(m)]||m.type}»: ${(m.lines||[]).map(l=>l.name+' ×'+skQty(Math.abs(m.type==='count'?l.delta:l.qty))).join(', ')}`,changes:[],payment:false})};
  const bk=m.type==='sale'&&m.bookingId?allB().find(x=>x.id===m.bookingId):null;
  if(bk){const ex=(bk.extras||[]).filter(e=>e.moveId!==m.id);const d=Object.assign(pick(bk,BF),{extras:ex,extrasSum:ex.reduce((a,e)=>a+(+e.sum||0),0)});await writeBooking(bk,d,'extra',apply)}
  else{const b=fdb.batch();apply(b);await b.commit()}
}

  mroot.querySelectorAll('.sk-dir button').forEach(bt=>bt.onclick=()=>{dir=bt.dataset.dir;mroot.querySelectorAll('.sk-dir button').forEach(z=>z.classList.toggle('on',z===bt));draw()});
  const box=$('sk-lines');
  box.addEventListener('change',e=>{const i=+e.target.dataset.i;if(e.target.classList.contains('sk-li')){lines[i].itemId=e.target.value;const x=skItem(e.target.value);if(x){if(type==='in')lines[i].cost=+x.cost||'';if(type==='sale')lines[i].price=+x.price||''}draw();const q=box.querySelector(`.sk-lq[data-i="${i}"]`);if(q)q.focus()}});
  box.addEventListener('input',e=>{const i=+e.target.dataset.i;if(e.target.classList.contains('sk-lq'))lines[i].qty=e.target.value;if(e.target.classList.contains('sk-lc'))lines[i].cost=e.target.value;if(e.target.classList.contains('sk-lp'))lines[i].price=e.target.value;sum()});
  box.addEventListener('click',e=>{const b=e.target.closest('.sk-lx');if(b){lines.splice(+b.dataset.i,1);draw()}});
  let busy=false;
  $('sko').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const fail=t=>{$('sk-err').textContent=t;$('sk-err').hidden=false};$('sk-err').hidden=true;
    const L=lines.filter(l=>l.itemId&&+l.qty>0);if(!L.length)return fail('Выберите товар и укажите количество.');
    const seen=new Set();for(const l of L){if(seen.has(l.itemId))return fail('Один и тот же товар указан дважды — объедините строки.');seen.add(l.itemId)}
    const out=[];for(const l of L){const x=skItem(l.itemId),q=+l.qty;
      const avail=type==='laundry'&&dir==='in'?(+x.laundry||0):(+x.qty||0);
      if(type!=='in'&&!(type==='laundry'&&dir==='in')&&q>avail)return fail(`«${x.name}»: на складе только ${skQty(avail)} ${x.unit||'шт'}.`);
      if(type==='laundry'&&dir==='in'&&q>avail)return fail(`«${x.name}»: в прачечной числится только ${skQty(avail)}.`);
      const line={itemId:x.id,name:x.name,unit:x.unit||'шт',qty:q,cost:type==='in'?(+l.cost||0):(+x.cost||0)};
      if(type==='in')line.delta=q;else if(type==='laundry'){line.delta=dir==='out'?-q:q;line.ldelta=dir==='out'?q:-q}else line.delta=-q;
      if(type==='sale')line.price=+l.price||0;
      out.push(line)}
    const op={type,lines:out,note:$('sk-note').value.trim()};
    if(type==='in'){op.supplier=$('sk-sup').value.trim();op.sum=out.reduce((a,l)=>a+l.qty*l.cost,0)}
    if(type==='out'){op.to=$('sk-to').value.trim();if(!op.to)return fail('Укажите, кому выдано.')}
    if(type==='writeoff')op.reason=$('sk-rs').value;
    if(type==='laundry')op.dir=dir;
    busy=true;
    try{
      if(type==='sale'){const bk=allB().find(b=>b.id===$('sk-bk').value);if(!bk){busy=false;return fail('Выберите гостя.')}
        op.bookingId=bk.id;op.roomNo=roomNo(bk.roomId);op.guest=bk.guest||'';op.sum=out.reduce((a,l)=>a+l.qty*l.price,0);
        await stockCommit(op,async(mid,commitTo)=>{const add_=out.map(l=>({moveId:mid,name:l.name,qty:l.qty,price:l.price,sum:l.qty*l.price,at:Date.now(),by:me.name}));
          const ex=(bk.extras||[]).concat(add_);const d=Object.assign(pick(bk,BF),{extras:ex,extrasSum:ex.reduce((a,e)=>a+(+e.sum||0),0)});
          await writeBooking(bk,d,'extra',commitTo)});
      }else await stockCommit(op);
      close();toast(`${SOP[type]}: проведено`)}
    catch(err){busy=false;fail('Не удалось: '+errText(err))}});
}

function openStockCount(){
  const act=stock.filter(x=>x.active!==false).sort((a,b)=>Object.keys(SG).indexOf(a.group)-Object.keys(SG).indexOf(b.group)||String(a.name).localeCompare(String(b.name),'ru'));
  let g=null;
  mroot.innerHTML=`<div class="scrim" id="scrim"><form class="modal" id="skc" style="max-width:640px" autocomplete="off"><h3>Инвентаризация</h3>
    <p class="muted" style="margin:0 0 10px">Пересчитайте товары и впишите фактическое количество. Пустое поле — без изменений. Система покажет расхождение и выровняет остатки.</p>
    <div class="sk-count">${act.map(x=>{let s='';if(x.group!==g){g=x.group;s=`<div class="sk-cg">${SG[g]||''}</div>`}return s+`<label class="sk-cr"><span translate="no">${esc(trW(x.name))} <span class="muted">(${esc(trW(x.unit||'шт'))})</span></span><span class="muted">учёт: ${skQty(x.qty)}</span><input type="number" min="0" step="any" inputmode="decimal" data-id="${x.id}" placeholder="факт"><span class="sk-diff" data-d="${x.id}"></span></label>`}).join('')}</div>
    <div class="err" id="skc-err" hidden></div>
    <div class="actions"><span></span><div class="r"><button type="button" class="btn" id="skc-x">Закрыть</button><button class="btn primary">Сохранить пересчёт</button></div></div></form></div>`;
  const $=id=>document.getElementById(id);$('skc-x').onclick=close;
  mroot.querySelector('.sk-count').addEventListener('input',e=>{const id=e.target.dataset.id;if(!id)return;const x=skItem(id),el=mroot.querySelector(`[data-d="${id}"]`);const v=e.target.value;
    if(v===''){el.textContent='';return}const d=+v-(+x.qty||0);el.textContent=d===0?'✓':(d>0?'+':'')+skQty(d);el.className='sk-diff '+(d<0?'neg':d>0?'pos':'')});
  $('skc').addEventListener('submit',async e=>{e.preventDefault();const L=[];mroot.querySelectorAll('.sk-count input').forEach(inp=>{if(inp.value==='')return;const x=skItem(inp.dataset.id),d=+inp.value-(+x.qty||0);if(d!==0)L.push({itemId:x.id,name:x.name,unit:x.unit||'шт',qty:Math.abs(d),delta:d,cost:+x.cost||0,fact:+inp.value,was:+x.qty||0})});
    if(!L.length){close();toast('Расхождений нет');return}
    try{await stockCommit({type:'count',lines:L,note:'Пересчёт: '+L.map(l=>`${l.name} ${skQty(l.was)}→${skQty(l.fact)}`).join(', ')});close();toast(`Остатки выровнены: ${L.length} поз.`)}catch(err){$('skc-err').textContent='Не удалось: '+errText(err);$('skc-err').hidden=false}});
}
async function stockSeed(btn){btn.disabled=true;
  try{const b=fdb.batch();STOCK_SEED.forEach(([g,n,u,min])=>b.set(fdb.collection('stock').doc(),{name:n,group:g,unit:u,min,qty:0,laundry:0,cost:0,price:0,active:true,createdAt:TS(),updatedAt:TS()}));
    b.set(fdb.collection('log').doc(),{at:TS(),by:me.email,byName:me.name,kind:'stock',action:'stock-seed',target:'stock',room:'',guest:'',text:`Склад — заполнен типовым списком (${STOCK_SEED.length} поз.)`,changes:[],payment:false});
    await b.commit();toast('Список товаров создан — теперь внесите приход')}catch(e){btn.disabled=false;toast('Не удалось: '+errText(e))}}

app.addEventListener('click',e=>{const el=e.target.closest('[data-sk]');if(!el||!me||!can.book())return;const a=el.dataset.sk,v=el.dataset.v;
  if(a==='op')openStockOp(v,{itemId:el.dataset.id||''});
  if(a==='count'&&can.manage())openStockCount();
  if(a==='item'&&can.manage())openStockItem(el.dataset.id?skItem(el.dataset.id):null);
  if(a==='g'){st.skG=v;render()}
  if(a==='low'){st.skLow=!st.skLow;render()}
  if(a==='seed'&&can.manage())stockSeed(el);
  if(a==='undo'&&can.owner()){const m=smoves.find(x=>x.id===el.dataset.id);if(m)ask(`Отменить операцию «${SOPV[skMoveType(m)]}»? Остатки вернутся как было${m.type==='sale'?', сумма уберётся из счёта гостя':''}.`,'Отменить операцию',async()=>{try{await stockUndo(m);toast('Операция отменена')}catch(err){toast('Не удалось: '+errText(err))}})}
  if(a==='report'&&can.manage())loadStockReport();
  if(a==='xls'&&can.manage())stockXls();
});
app.addEventListener('input',e=>{if(e.target.id==='sk-q'){st.skQ=e.target.value;render()}});
app.addEventListener('change',e=>{if(e.target.id==='sk-rf')st.skFrom=e.target.value;if(e.target.id==='sk-rt')st.skTo=e.target.value});

/* ---------- live data: listeners that heal themselves ---------- */
let netOk=true;
function setNet(ok){if(ok===netOk)return;netOk=ok;let el=document.getElementById('net');
  if(!ok){if(!el){el=document.createElement('div');el.id='net';el.className='net';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent='Нет связи с базой — переподключаюсь…'}
  else if(el){el.textContent='Связь восстановлена';el.classList.add('ok');setTimeout(()=>el.remove(),1800)}}
function liveSub(makeQuery,onNext,onDenied){let unsub=null,tries=0,stopped=false,timer=null;
  const start=()=>{if(stopped)return;try{unsub=makeQuery().onSnapshot(s=>{tries=0;setNet(true);onNext(s)},e=>{
      if(e&&e.code==='permission-denied'){onDenied&&onDenied(e);return}
      setNet(false);tries++;try{unsub&&unsub()}catch(_){}timer=setTimeout(start,Math.min(30000,1500*tries))})}
    catch(e){tries++;timer=setTimeout(start,Math.min(30000,1500*tries))}};
  start();return()=>{stopped=true;clearTimeout(timer);try{unsub&&unsub()}catch(_){}}}
window.addEventListener('online',()=>setNet(true));
window.addEventListener('offline',()=>setNet(false));


/* ---------- new version of the site: apply without asking to refresh ---------- */
const MYVER=(document.querySelector('meta[name="app-version"]')||{}).content||'';let newVer=false;
async function checkVer(){if(location.protocol==='file:')return;try{const r=await fetch('./?vcheck='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/name="app-version" content="([^"]+)"/);
  if(m&&m[1]!==MYVER){newVer=true;tryReload()}}catch(e){}}
function tryReload(){if(!newVer)return;const busy=mroot.innerHTML||document.activeElement&&document.activeElement.closest('form,input,select,textarea');
  if(!busy)location.reload();else if(!document.getElementById('upd')){const b=document.createElement('button');b.id='upd';b.className='net ok upd';b.textContent='Сайт обновлён — нажмите, чтобы применить';b.onclick=()=>location.reload();document.body.appendChild(b)}}
setInterval(checkVer,5*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkVer();if(me&&!mroot.innerHTML&&!document.activeElement.closest('form,input,select,textarea'))render()}});

/* ---------- boot ---------- */
if(!window.firebase){app.innerHTML='<div class="notice">Не удалось загрузить систему. Проверьте интернет и обновите страницу.</div>';return}
firebase.initializeApp(FIREBASE_CONFIG);
auth=firebase.auth();auth.languageCode=LANG==='zh'?'zh-CN':'ru';
fdb=firebase.firestore();
try{fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
auth.getRedirectResult().catch(err=>showLogin(aerr(err)));
auth.onAuthStateChanged(u=>handleUser(u));
})();
