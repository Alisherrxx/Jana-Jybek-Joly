<style>
/* Layout: sticky top bar with tabs; working area below — room×date grid is the home screen, scrolls sideways inside its own frame */
:root{
  --bg:#eef1ed; --surface:#ffffff; --surface-2:#f6f8f5; --ink:#18221e; --muted:#5f6b65; --line:#d9dfd9;
  --accent:#1d5a48; --accent-ink:#ffffff; --accent-soft:#dcebe4; --brass:#a87a26;
  --booked:#2f68ad; --booked-bg:#dbe7f6; --in:#24855a; --in-bg:#d5efe2; --out:#77817c; --out-bg:#e6e9e7;

  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#5fbf9b; --accent-ink:#0d1714; --accent-soft:#1f3b31; --brass:#d8ab55;
  --booked:#7fb0ec; --booked-bg:#1f3350; --in:#6fd3a2; --in-bg:#1b3b2c; --out:#9aa6a0; --out-bg:#262f2b;

:root[data-theme="dark"]{

  --accent:#5fbf9b; --accent-ink:#0d1714; --accent-soft:#1f3b31; --brass:#d8ab55;
  --booked:#7fb0ec; --booked-bg:#1f3350; --in:#6fd3a2; --in-bg:#1b3b2c; --out:#9aa6a0; --out-bg:#262f2b;

*{box-sizing:border-box}
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}

.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0;letter-spacing:.01em}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:16px}
.toolbar .grow{flex:1}
.toolbar input[type=date],.toolbar input[type=month],.toolbar input[type=search],.toolbar select{border:1px solid var(--line);background:var(--surface);padding:7px 10px;border-radius:8px}
.notice{padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-weight:500;margin-top:16px}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* grid */

.rm .no{font-family:var(--f-mono);font-weight:500;font-size:15px;display:flex;align-items:center;gap:6px}
.rm .ty{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.hk{width:8px;height:8px;border-radius:50%;display:inline-block}
.hk.clean{background:var(--in)} .hk.dirty{background:var(--warn)} .hk.repair{background:var(--bad)}
.grid tr.floor td{height:26px;background:var(--surface-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px;font-weight:600}
.grid tr.floor td.rm{background:var(--surface-2)}
.grid .we{background:var(--weekend)}

.cell-empty{cursor:pointer}

.bar{display:flex;align-items:center;gap:4px;margin:5px 3px;height:34px;padding:0 8px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;overflow:hidden;white-space:nowrap;border:0;width:calc(100% - 6px);text-align:left}
.bar span{overflow:hidden;text-overflow:ellipsis}
.bar.booked{background:var(--booked-bg);color:var(--booked);box-shadow:inset 3px 0 0 var(--booked)}
.bar.in{background:var(--in-bg);color:var(--in);box-shadow:inset 3px 0 0 var(--in)}
.bar.out{background:var(--out-bg);color:var(--out);box-shadow:inset 3px 0 0 var(--out)}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0;box-shadow:none}
.bar .debt{flex:none;width:7px;height:7px;border-radius:50%;background:var(--bad)}

/* cards & lists */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}

.stat .s{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}

.row .sub{font-size:13px;color:var(--muted)}
.room-tag{font-family:var(--f-mono);font-weight:500;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:14px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.booked{background:var(--booked-bg);color:var(--booked)} .pill.in{background:var(--in-bg);color:var(--in)}
.pill.out{background:var(--out-bg);color:var(--out)} .pill.cancelled{background:var(--bad-bg);color:var(--bad)}
.pill.debt{background:var(--bad-bg);color:var(--bad)} .pill.paid{background:var(--in-bg);color:var(--in)}
.muted{color:var(--muted)}
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.data{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.data th,.data td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}
.data th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.data td.r,.data th.r{text-align:right}
.data tr.click{cursor:pointer}.data tr.click:hover td{background:var(--surface-2)}
.tbl{overflow-x:auto}
.hk-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:620px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0 0 4px}
.modal .ref{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 10px;font-size:15px;font-weight:400;color:var(--ink);width:100%}
.form textarea{min-height:64px;resize:vertical}
.sum{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:16px;background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14px}
.sum b{font-family:var(--f-mono)}
.err{grid-column:1/-1;background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:8px;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;justify-content:space-between}
.actions .l,.actions .r{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60}
@media (max-width:560px){.form{grid-template-columns:1fr}.stat .v{font-size:20px}}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}}}

<script>
(function(){
const OWNER='alisherr404@gmail.com';
const ROLES={owner:'Владелец',manager:'Управляющий',admin:'Администратор',viewer:'Просмотр',novice:'Новичок'};
const STATUS={booked:'Бронь',in:'Заселён',out:'Выехал',cancelled:'Отменена'};
const HK={clean:'Чистый',dirty:'Уборка',repair:'Ремонт'};
const PAY=['Наличные','Kaspi','Карта','Перевод','Безнал (юрлицо)'];
const SRC=['Звонок / WhatsApp','С улицы','Booking.com','Instagram / 2ГИС','Юрлицо','Другое'];
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const TABS=[['grid','Шахматка','see'],['today','Сегодня','read'],['list','Брони','read'],['rooms','Номера','read'],['report','Отчёт','manage'],['log','Журнал','owner'],['staff','Сотрудники','owner']];

let occ=[],creds={},pendingReg=null;let auth=null,fdb=null,me=null,rooms=[],bookings=[],hist=null,histLoading=false,staffList=[],logs=null,logLoading=false,subs=[],loaded={r:false,b:false};
const can={see:()=>!!me,read:()=>!!me&&me.role!=='novice',book:()=>!!me&&['owner','manager','admin'].includes(me.role),manage:()=>!!me&&['owner','manager'].includes(me.role),owner:()=>!!me&&me.role==='owner'};

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const P=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const F=t=>new Date(t).toISOString().slice(0,10);
const add=(s,n)=>F(P(s)+n*864e5);
const diffD=(a,b)=>Math.round((P(b)-P(a))/864e5);
const wd=s=>new Date(P(s)).getUTCDay();
const human=s=>{if(!s)return'';const[y,m,d]=String(s).split('-');return +d+' '+MON[+m-1]};
const dmy=s=>{if(!s)return'';const[y,m,d]=String(s).split('-');return d+'.'+m+'.'+y};
const tg=n=>(Math.round(+n||0)).toLocaleString('ru-RU')+' ₸';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ref=id=>String(id).slice(0,6).toUpperCase();
const toDate=t=>!t?null:(t.toDate?t.toDate():new Date(t));
const stamp=t=>{const d=toDate(t);if(!d||isNaN(d))return'';return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const liveFrom=()=>add(today(),-45);

let st={tab:'grid',start:add(today(),-1),span:14,month:today().slice(0,7),q:'',filter:'active',exFrom:today().slice(0,7)+'-01',exTo:today(),lgFrom:add(today(),-7),lgTo:today(),lgWho:'',lgType:'',lgRoom:'',authMode:'login'};
try{const s=JSON.parse(localStorage.getItem('hotel-ui')||'{}');if(s.span)st.span=s.span;if(s.tab)st.tab=s.tab}catch(e){}
const saveUi=()=>{try{localStorage.setItem('hotel-ui',JSON.stringify({span:st.span,tab:st.tab}))}catch(e){}};

const app=document.getElementById('app'),mroot=document.getElementById('modal-root'),tabsEl=document.getElementById('tabs'),whoEl=document.getElementById('who');
const roomById=id=>rooms.find(r=>r.id===id);
const roomNo=id=>(roomById(id)||{}).number||'?';
const sortedRooms=(all)=>rooms.filter(r=>all||r.active!==false).sort((a,b)=>String(a.number).localeCompare(String(b.number),'ru',{numeric:true}));
const live=b=>b.status!=='cancelled';
const nights=b=>Math.max(0,diffD(b.checkIn,b.checkOut));
const total=b=>nights(b)*(+b.price||0);
const debt=b=>Math.max(0,total(b)-(+b.paid||0));
function allB(){if(!hist)return bookings;const m=new Map(hist.map(b=>[b.id,b]));bookings.forEach(b=>m.set(b.id,b));return[...m.values()]}
const onDay=(list,roomId,d)=>list.find(b=>live(b)&&b.roomId===roomId&&b.checkIn<=d&&d<b.checkOut);
const LOGIN_DOMAIN='login.invalid',LOGIN_RE=/^[a-z0-9._-]{3,30}$/;
const toEmail=x=>{x=String(x||'').trim().toLowerCase();return x.includes('@')?x:x+'@'+LOGIN_DOMAIN};
const isInternal=em=>String(em||'').endsWith('@'+LOGIN_DOMAIN);
const showId=em=>isInternal(em)?String(em).split('@')[0]:String(em||'');
const staffName=em=>{if(!em)return'';const s=staffList.find(x=>x.id===em);return(s&&s.name)||(em===OWNER?'Владелец':showId(em))};

function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
async function loadHist(force){if(histLoading||(hist&&!force))return;histLoading=true;try{const s=await fdb.collection('bookings').get();hist=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){toast('Не удалось загрузить архив броней: '+(e.message||e.code))}histLoading=false;render()}

/* ---------- log & writes ---------- */
const BF={roomId:'Номер',status:'Статус',checkIn:'Заезд',checkOut:'Выезд',guest:'Гость',phone:'Телефон',guests:'Гостей',doc:'Документ',source:'Источник',price:'Цена/ночь',paid:'Оплачено',payMethod:'Способ оплаты',company:'Компания',note:'Комментарий'};
const RF={number:'Номер',floor:'Этаж',type:'Тип',capacity:'Мест',price:'Цена/ночь',active:'Продаётся',note:'Заметка',hk:'Состояние'};
const SF={name:'Имя',role:'Роль',active:'Активен'};
function fmtB(k,v){if(k==='roomId')return roomNo(v);if(k==='status')return STATUS[v]||v;if(k==='checkIn'||k==='checkOut')return human(v);if(k==='price'||k==='paid')return tg(v);return v??''}

function changes(prev,next,FL,fmt){if(!prev)return[];const out=[];for(const k in FL){const a=prev[k]??'',b=next[k]??'';if(String(a)!==String(b))out.push({f:FL[k],from:String(fmt(k,a)),to:String(fmt(k,b))})}return out}

async function writeBooking(prev,data,action){

}

function periodStats(list,from,toEx){
  let rev=0,nts=0;const bySrc={},byType={},byRoom={};
  list.filter(b=>live(b)&&b.checkIn<toEx&&b.checkOut>from).forEach(b=>{
    const a=b.checkIn>from?b.checkIn:from,e=b.checkOut<toEx?b.checkOut:toEx,n=Math.max(0,diffD(a,e)),v=n*(+b.price||0);rev+=v;nts+=n;
    const s=b.source||'Другое';bySrc[s]=(bySrc[s]||0)+v;const r=roomById(b.roomId)||{};const t=r.type||'—';byType[t]=(byType[t]||0)+v;
    byRoom[b.roomId]=byRoom[b.roomId]||{n:0,v:0};byRoom[b.roomId].n+=n;byRoom[b.roomId].v+=v});
  const arrivals=list.filter(b=>live(b)&&b.checkIn>=from&&b.checkIn<toEx);let paid=0,owe=0;const byPay={};
  arrivals.forEach(b=>{paid+=+b.paid||0;owe+=debt(b);const p=b.payMethod||'—';byPay[p]=(byPay[p]||0)+(+b.paid||0)});
  const rs=sortedRooms(),days=diffD(from,toEx),occ=rs.length&&days?Math.round(nts/(rs.length*days)*100):0;
  return{rev,nts,bySrc,byType,byRoom,byPay,paid,owe,occ,adr:nts?rev/nts:0,days,arrivals};
}

  <div class="cols">${tbl(S.bySrc,'По источникам')}${tbl(S.byType,'По типам номеров')}${tbl(S.byPay,'Оплаты по способам')}</div>

async function fetchLog(from,toEx){
  const s=await fdb.collection('log').where('at','>=',new Date(P(from)-5*36e5)).where('at','<',new Date(P(toEx)-5*36e5)).orderBy('at','desc').limit(1000).get();
  return s.docs.map(d=>({id:d.id,...d.data()}));
}

    const rr=[['Номер','Тип','Этаж','Ночей продано','Загрузка, %','Выручка, ₸'],...sortedRooms().map(r=>{const x=S.byRoom[r.id]||{n:0,v:0};return[r.number,r.type||'',r.floor,x.n,S.days?Math.round(x.n/S.days*100):0,x.v]})];
    const debts=[BH,...list.filter(b=>live(b)&&debt(b)>0).sort((a,b)=>a.checkIn.localeCompare(b.checkIn)).map(bRowX)];
    const sheets=[['Сводка',sum],['Брони',[BH,...inP.map(bRowX)]],['Оплаты',pays],['По номерам',rr],['Долги',debts]];
    if(can.owner())sheets.push(['Журнал',logRows(await fetchLog(from,toEx))]);
    saveXlsx(`Отчёт ${dmy(from)}-${dmy(to)}.xlsx`,sheets);toast('Файл скачан');
  }catch(e){toast('Не удалось выгрузить: '+errText(e))}
  btn.disabled=false;btn.textContent='Скачать отчёт .xlsx';
}
async function doBackup(btn){
  btn.disabled=true;btn.textContent='Готовим копию…';
  try{await loadHist(true);const ls=(await fdb.collection('log').orderBy('at','desc').get()).docs.map(d=>({id:d.id,...d.data()}));

      ['Номера',[['Номер','Этаж','Тип','Мест','Цена/ночь','Продаётся','Состояние','Заметка'],...sortedRooms(true).map(r=>[r.number,r.floor,r.type||'',r.capacity||'',+r.price||0,r.active===false?'Нет':'Да',HK[r.hk||'clean'],r.note||''])]],

      ['Сотрудники',[['Логин / email','Имя','Роль','Активен'],[OWNER,'Владелец','Владелец','Да'],...staffList.map(s=>[showId(s.id),s.name||'',ROLES[s.role]||s.role,s.active===false?'Нет':'Да'])]],

  if(a==='newroom'&&can.manage())openRoom({});
  if(a==='editroom'&&can.manage())openRoom(Object.assign({},roomById(el.dataset.id)));

      if(a==='checkout'){const r=roomById(b.roomId);if(r&&r.hk!=='dirty')await writeRoom(r,Object.assign(pick(r,RF),{hk:'dirty'}),'hk')}}catch(err){el.disabled=false;toast('Не удалось: '+errText(err))}}
  if(a==='hk'){const r=roomById(el.dataset.id);if(!r)return;const order=['clean','dirty','repair'];const d=pick(r,RF);d.hk=order[(order.indexOf(r.hk||'clean')+1)%3];
    try{await writeRoom(r,d,'hk')}catch(err){toast('Не удалось: '+errText(err))}}
  if(a==='seed'&&can.manage()){el.disabled=true;const plan=[];[2,3].forEach(f=>{const n=f===2?12:13;for(let i=1;i<=n;i++){let type='Стандарт',price=15000,cap=2;if(i>=5&&i<=8){type='Двухместный';price=18000}else if(i===9||i===10){type='Семейный';price=25000;cap=4}else if(i===11){type='Полулюкс';price=28000}else if(i>=12){type='Люкс';price=35000}plan.push({id:'r'+(f*100+i),d:{number:String(f*100+i),floor:f,type,capacity:cap,price,hk:'clean',active:true,note:''}})}});
    try{for(const p of plan)await writeRoom(null,p.d,'create',p.id);toast('Номера созданы')}catch(err){el.disabled=false;toast('Не удалось: '+errText(err))}}
  if(a==='export')doExport(el);
  if(a==='backup'&&can.owner())doBackup(el);
  if(a==='reloadlog')loadLog();
  if(a==='regack'&&can.owner()){el.disabled=true;try{await fdb.collection('staff').doc(el.dataset.id).set({ack:true},{merge:true})}catch(err){el.disabled=false;toast('Не удалось: '+errText(err))}}
  if(a==='showpass'){el.outerHTML=`<span class="money">${esc(el.dataset.pw)}</span>`}
  if(a==='staffdel'&&can.owner()){const s=staffList.find(x=>x.id===el.dataset.id);if(!s)return;
    ask('Удалить доступ для «'+esc(s.name||showId(s.id))+'»? Войти под этим логином больше не получится.','Удалить',async()=>{try{await writeStaff(s,s.id,{name:s.name||'',role:s.role,active:false,deleted:true,ack:true},'delete');try{await fdb.collection('creds').doc(s.id).delete()}catch(e){}toast('Доступ удалён')}catch(err){toast('Не удалось: '+errText(err))}})}
  if(a==='staffactive'&&can.owner()){const s=staffList.find(x=>x.id===el.dataset.id);if(!s)return;const d={name:s.name||'',role:s.role,active:s.active===false,ack:true};
    try{await writeStaff(s,s.id,d,'update');toast(d.active?'Доступ включён':'Доступ отключён')}catch(err){toast('Не удалось: '+errText(err))}}
});

let qt;app.addEventListener('input',e=>{const id=e.target.id;if(id==='l-q'||id==='lg-room'){clearTimeout(qt);qt=setTimeout(()=>{if(id==='l-q')st.q=e.target.value;else st.lgRoom=e.target.value;render();const i=document.getElementById(id);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},300)}});
app.addEventListener('submit',async e=>{
  if(e.target.id==='sf'){e.preventDefault();const raw=document.getElementById('s-login').value.trim().toLowerCase(),name=document.getElementById('s-name').value.trim(),role=document.getElementById('s-role').value,pw=document.getElementById('s-pass').value,er=document.getElementById('s-err');
    const fail=t=>{er.textContent=t;er.hidden=false};const btn=e.target.querySelector('button');
    let em;
    if(raw.includes('@')){if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(raw))return fail('Проверьте email.');em=raw}
    else{if(!LOGIN_RE.test(raw))return fail('Логин: от 3 до 30 латинских букв или цифр, можно точку, дефис и _.');if(pw.length<6)return fail('Пароль — минимум 6 символов.');em=toEmail(raw)}
    if(em===OWNER)return fail('Это email владельца.');
    const prev=staffList.find(s=>s.id===em);
    btn.disabled=true;
    try{
      if(!raw.includes('@')&&!prev){
        const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec');
        try{const c=await sec.auth().createUserWithEmailAndPassword(em,pw);await c.user.updateProfile({displayName:name});await sec.auth().signOut()}
        catch(err){if(err.code==='auth/email-already-in-use'){btn.disabled=false;return fail('Логин «'+raw+'» уже занят. Придумайте другой.')}throw err}
      }
      if(prev&&!prev.deleted){btn.disabled=false;return fail('Такой сотрудник уже есть.')}
      await writeStaff(null,em,{name,role,active:true,deleted:false,ack:true,login:raw.includes('@')?'':raw},'create',raw.includes('@')?null:{login:raw,password:pw,name,at:TS()});
      e.target.reset();toast(raw.includes('@')?'Сотрудник добавлен':'Создан логин «'+raw+'». Передайте сотруднику логин и пароль.');
    }catch(err){fail('Не удалось: '+(err.code&&err.code.startsWith('auth/')?aerr(err):errText(err)))}
    btn.disabled=false}
  if(e.target.id==='login-form'){e.preventDefault();doAuth()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mroot.innerHTML)close()});

/* ---------- auth ---------- */
const AUTHERR={'auth/invalid-credential':'Неверный логин или пароль.','auth/wrong-password':'Неверный логин или пароль.','auth/user-not-found':'Неверный логин или пароль.','auth/invalid-email':'Проверьте логин.','auth/email-already-in-use':'Такой логин уже занят. Придумайте другой.','auth/weak-password':'Пароль слишком короткий — минимум 6 символов.','auth/too-many-requests':'Слишком много попыток. Подождите несколько минут.','auth/network-request-failed':'Нет интернета. Проверьте подключение.','auth/popup-closed-by-user':'Окно входа закрыто.','auth/unauthorized-domain':'Этот адрес сайта не разрешён для входа через Google. Сообщите владельцу.','auth/account-exists-with-different-credential':'Этот email уже зарегистрирован другим способом.'};
const aerr=e=>AUTHERR[e&&e.code]||('Ошибка входа: '+((e&&e.message)||e));
function showLogin(msg){
  whoEl.innerHTML='';renderTabs();const m=st.authMode;
  app.innerHTML=`<form class="login" id="login-form" autocomplete="on">
    <h2>${m==='login'?'Вход для сотрудников':'Регистрация'}</h2>
    <p>${m==='login'?'Введите логин и пароль, которые вам выдали.':'Придумайте логин и пароль. Сразу после регистрации откроется просмотр занятости номеров, остальной доступ выдаёт владелец.'}</p>
    ${m==='reg'?'<input id="a-name" placeholder="Ваше имя" autocomplete="name" required>':''}
    <input id="a-login" placeholder="${m==='login'?'Логин':'Придумайте логин (латиницей)'}" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <input id="a-pass" type="password" placeholder="${m==='reg'?'Придумайте пароль (от 6 символов)':'Пароль'}" autocomplete="${m==='reg'?'new-password':'current-password'}" required minlength="6">
    ${m==='reg'?'<input id="a-pass2" type="password" placeholder="Повторите пароль" autocomplete="new-password" required minlength="6">':''}
    <button class="btn primary" type="submit">${m==='login'?'Войти':'Зарегистрироваться'}</button>
    <div class="err" id="a-err" ${msg?'':'hidden'}>${esc(msg||'')}</div>
    ${m==='login'?'<div class="or">или</div><button type="button" class="btn" data-auth="google">Войти через Google</button>':''}
    <div class="links">${m==='login'?'<button type="button" class="linkbtn" data-auth="reg">Регистрация</button><span class="muted" style="font-size:13px">Забыли пароль — обратитесь к владельцу</span>':'<button type="button" class="linkbtn" data-auth="login">← Ко входу</button>'}</div>
  </form>`;
}
app.addEventListener('click',async e=>{const b=e.target.closest('[data-auth]');if(!b)return;const a=b.dataset.auth;
  if(a==='login'||a==='reg'){st.authMode=a;showLogin();return}
  if(a==='google'){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    try{await auth.signInWithPopup(p)}catch(err){if(err.code==='auth/popup-blocked'||err.code==='auth/operation-not-supported-in-this-environment'){await auth.signInWithRedirect(p)}else if(err.code!=='auth/cancelled-popup-request')showLogin(aerr(err))}}
  if(a==='verified'){const u=auth.currentUser;if(!u)return;await u.reload();await auth.currentUser.getIdToken(true);handleUser(auth.currentUser)}
  if(a==='resend'){try{await auth.currentUser.sendEmailVerification();toast('Письмо отправлено ещё раз')}catch(err){toast(aerr(err))}}
  if(a==='logout')auth.signOut();
});
whoEl.addEventListener('click',e=>{if(e.target.closest('[data-auth="logout"]'))auth.signOut()});
async function doAuth(){
  const raw=(document.getElementById('a-login').value||'').trim().toLowerCase(),pw=document.getElementById('a-pass').value||'',er=document.getElementById('a-err');
  const fail=t=>{er.textContent=t;er.hidden=false};
  try{
    if(st.authMode==='login'){await auth.signInWithEmailAndPassword(toEmail(raw),pw)}
    else{
      const name=document.getElementById('a-name').value.trim();
      if(!name)return fail('Укажите имя.');
      if(raw.includes('@')||!LOGIN_RE.test(raw))return fail('Логин: от 3 до 30 латинских букв или цифр, можно точку, дефис и _.');
      if(pw!==document.getElementById('a-pass2').value)return fail('Пароли не совпадают.');
      const em=toEmail(raw);pendingReg={em,name,login:raw,password:pw};
      const c=await auth.createUserWithEmailAndPassword(em,pw);await c.user.updateProfile({displayName:name});
    }
  }catch(err){pendingReg=null;fail(aerr(err))}
}
function showVerify(u){whoEl.innerHTML=`<button class="linkbtn" data-auth="logout">Выйти</button>`;renderTabs();
  app.innerHTML=`<div class="login"><h2>Подтвердите email</h2><p>Мы отправили письмо на <b>${esc(u.email)}</b>. Откройте его и перейдите по ссылке. Если письма нет — проверьте папку «Спам».</p>
  <button class="btn primary" data-auth="verified">Я подтвердил(а)</button><button class="btn" data-auth="resend">Отправить письмо ещё раз</button><button class="btn" data-auth="logout">Выйти</button></div>`}
function showNoAccess(em,kind){whoEl.innerHTML=`<button class="linkbtn" data-auth="logout">Выйти</button>`;renderTabs();
  const id=esc(showId(em));
  const txt=kind==='off'?`Доступ для <b>${id}</b> отключён владельцем.`:kind==='pending'?`Заявка от <b>${id}</b> отправлена владельцу. Когда он её одобрит, нажмите «Проверить снова».`:`Аккаунт <b>${id}</b> не добавлен в сотрудники. Обратитесь к владельцу.`;
  app.innerHTML=`<div class="login"><h2>${kind==='pending'?'Заявка отправлена':'Нет доступа'}</h2><p>${txt}</p>
  <button class="btn primary" data-auth="verified">Проверить снова</button><button class="btn" data-auth="logout">Выйти</button></div>`}
function stopSubs(){subs.forEach(f=>{try{f()}catch(e){}});subs=[];rooms=[];bookings=[];hist=null;staffList=[];occ=[];creds={};logs=null;loaded={r:false,b:false}}
async function handleUser(u){
  stopSubs();me=null;close();
  if(!u){showLogin();return}
  const em=(u.email||'').toLowerCase();
  if(!em){showNoAccess('—');return}
  if(!isInternal(em)&&!u.emailVerified){showVerify(u);return}
  let role=em===OWNER?'owner':null,name=em===OWNER?(u.displayName||'Владелец'):(u.displayName||showId(em));
  if(role!=='owner'){
    try{let s=await fdb.collection('staff').doc(em).get();
      if(!s.exists&&isInternal(em)&&pendingReg&&pendingReg.em===em){
        const p=pendingReg;pendingReg=null;const b=fdb.batch();
        b.set(fdb.collection('staff').doc(em),{name:p.name,role:'novice',active:true,self:true,login:p.login,addedAt:TS(),lastSeen:TS()});
        b.set(fdb.collection('creds').doc(em),{login:p.login,password:p.password,name:p.name,at:TS()});
        b.set(fdb.collection('log').doc(),{at:TS(),by:em,byName:p.name,kind:'staff',action:'register',target:em,room:'',guest:'',text:`Зарегистрировался(ась) сам(а): ${p.name} (${p.login}) — Новичок`,changes:[],payment:false});
        await b.commit();s=await fdb.collection('staff').doc(em).get()}
      if(s.exists){const d=s.data();if(d.name)name=d.name;if(d.active===false||d.deleted){showNoAccess(em,'off');return}role=d.role;
        fdb.collection('staff').doc(em).update({lastSeen:TS()}).catch(()=>{})}
    }catch(e){console.error(e)}
  }
  if(!role){showNoAccess(em);return}
  me={email:em,name,role};
  whoEl.innerHTML=`<span><b>${esc(name)}</b></span><span class="role">${ROLES[role]}</span><button class="linkbtn" data-auth="logout">Выйти</button>`;
  render();
  const onErr=e=>{if(e.code==='permission-denied')app.innerHTML='<div class="notice">Нет доступа к данным. Попросите владельца проверить вашу роль.</div>';else toast('Связь с базой прервана — обновите страницу')};
  subs.push(fdb.collection('rooms').onSnapshot(s=>{rooms=s.docs.map(x=>({id:x.id,...x.data()}));loaded.r=true;render()},onErr));
  if(role==='novice'){subs.push(fdb.collection('occ').where('checkOut','>=',liveFrom()).onSnapshot(s=>{occ=s.docs.map(x=>({id:x.id,...x.data()}));render()},onErr));return}
  subs.push(fdb.collection('bookings').where('checkOut','>=',liveFrom()).onSnapshot(s=>{bookings=s.docs.map(x=>({id:x.id,...x.data()}));if(hist){const ids=new Set(bookings.map(b=>b.id));s.docChanges().forEach(c=>{if(c.type==='removed'&&!ids.has(c.doc.id))hist=hist.filter(h=>h.id!==c.doc.id)})}loaded.b=true;render()},onErr));
  if(can.manage())subs.push(fdb.collection('staff').onSnapshot(s=>{staffList=s.docs.map(x=>({id:x.id,...x.data()}));renderTabs();if(st.tab==='staff'||st.tab==='log')render()},()=>{}));
  if(can.owner()){subs.push(fdb.collection('creds').onSnapshot(s=>{creds={};s.docs.forEach(x=>creds[x.id]=x.data());if(st.tab==='staff')render()},()=>{}));
    let synced=false;subs.push(fdb.collection('occ').where('checkOut','>=',liveFrom()).onSnapshot(async s=>{if(synced||!loaded.b)return;synced=true;
      const have=new Map(s.docs.map(x=>[x.id,x.data()]));const b=fdb.batch();let n=0;
      bookings.forEach(bk=>{const o=have.get(bk.id);if(!o||o.status!==bk.status||o.checkIn!==bk.checkIn||o.checkOut!==bk.checkOut||o.roomId!==bk.roomId){b.set(fdb.collection('occ').doc(bk.id),{roomId:bk.roomId,checkIn:bk.checkIn,checkOut:bk.checkOut,status:bk.status});n++}});
      if(n)try{await b.commit()}catch(e){console.error(e)}},()=>{}))}
}

/* ---------- boot ---------- */
if(!window.firebase){app.innerHTML='<div class="notice">Не удалось загрузить систему. Проверьте интернет и обновите страницу.</div>';return}
firebase.initializeApp(FIREBASE_CONFIG);
auth=firebase.auth();auth.languageCode='ru';
fdb=firebase.firestore();
try{fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
auth.getRedirectResult().catch(err=>showLogin(aerr(err)));
auth.onAuthStateChanged(u=>handleUser(u));
})();
