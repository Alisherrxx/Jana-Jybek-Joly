/* Quiet luxury: warm stone ground, ivory cards, espresso ink; bronze only as hairline accent. Cormorant Garamond for names & figures, Jost for UI */
:root{
  --bg:#f4f0e8; --bg-2:#ece6da; --surface:#fffdf9; --surface-2:#f8f4ec; --surface-3:#efe8db; --ink:#26221c; --ink-2:#3d362c; --muted:#8a8275; --line:rgba(38,34,28,.09); --line-2:rgba(38,34,28,.17);
  --bronze:#8a6d3b; --bronze-soft:rgba(138,109,59,.10); --gold:#8a6d3b; --gold-2:#6f5730; --accent:#26221c; --accent-ink:#fbf8f2; --accent-soft:rgba(38,34,28,.06); --brass:#8a6d3b;
  --booked:#3d5f8f; --booked-bg:#e8edf4; --in:#3f6f55; --in-bg:#e6efe8; --out:#857d70; --out-bg:#efece6;
  --warn:#9c6326; --warn-bg:#f5ebdd; --bad:#9e3f37; --bad-bg:#f6e6e3; --insp:#6a5590; --insp-bg:#eee9f4;
  --weekend:rgba(38,34,28,.022); --today:rgba(138,109,59,.07); --floor-bg:#ebe4d7; --floor-ink:#26221c;
  --t-grid:#3f6f55; --t-today:#3d5f8f; --t-list:#6a5590; --t-rooms:#9c6326; --t-hk:#8f4a64; --t-report:#3c7480; --t-log:#6b655b; --t-staff:#8a6d3b;
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --f-mono:"Jost",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0;letter-spacing:.01em}
.brand h1 span{color:var(--brass)}
.brand h1.logo{font-family:"Marcellus","Cormorant Garamond",Georgia,serif;font-weight:400;font-size:26px;letter-spacing:.08em;line-height:1.1;
  background:linear-gradient(100deg,#8a6216 0%,#d9a93c 35%,#f3d27a 50%,#c8922b 65%,#8a6216 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
@media (max-width:560px){.brand h1.logo{font-size:21px}}
.who{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:4px 12px}
nav.tabs button{--tc:var(--accent);border:2px solid color-mix(in srgb,var(--tc) 35%,transparent);background:color-mix(in srgb,var(--tc) 10%,var(--surface));color:var(--tc);
  padding:8px 16px;border-radius:999px;font-family:var(--f-display);font-weight:500;font-size:13.5px;letter-spacing:.02em;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s,color .15s}
nav.tabs button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tc)}
nav.tabs button:hover{background:color-mix(in srgb,var(--tc) 20%,var(--surface))}
nav.tabs button[aria-selected="true"]{background:var(--tc);color:#fff;border-color:var(--tc);box-shadow:0 4px 12px color-mix(in srgb,var(--tc) 35%,transparent)}
nav.tabs button[aria-selected="true"]::before{background:#fff}
nav.tabs button[data-tab="grid"]{--tc:var(--t-grid)} nav.tabs button[data-tab="today"]{--tc:var(--t-today)} nav.tabs button[data-tab="list"]{--tc:var(--t-list)}
nav.tabs button[data-tab="rooms"]{--tc:var(--t-rooms)} nav.tabs button[data-tab="hk"]{--tc:var(--t-hk)} nav.tabs button[data-tab="report"]{--tc:var(--t-report)}
nav.tabs button[data-tab="log"]{--tc:var(--t-log)} nav.tabs button[data-tab="staff"]{--tc:var(--t-staff)}
#app{--tc:var(--accent)} #app[data-tab="grid"]{--tc:var(--t-grid)} #app[data-tab="today"]{--tc:var(--t-today)} #app[data-tab="list"]{--tc:var(--t-list)} #app[data-tab="rooms"]{--tc:var(--t-rooms)}
#app[data-tab="hk"]{--tc:var(--t-hk)} #app[data-tab="report"]{--tc:var(--t-report)} #app[data-tab="log"]{--tc:var(--t-log)} #app[data-tab="staff"]{--tc:var(--t-staff)}
nav.tabs button:focus-visible,.btn:focus-visible,.cell-empty:focus-visible,.bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:16px}
.toolbar .grow{flex:1}
.toolbar input[type=date],.toolbar input[type=month],.toolbar input[type=search],.toolbar select{border:1px solid var(--line);background:var(--surface);padding:7px 10px;border-radius:8px}
.notice{padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-weight:500;margin-top:16px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}

/* grid */
.grid-frame{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:44px;padding:0}
.grid thead th{position:sticky;top:0;background:var(--surface-2);font-weight:500;font-size:12px;color:var(--muted);width:64px;min-width:64px;text-align:center;line-height:1.15;padding:6px 2px}
.grid thead th b{display:block;font-size:15px;color:var(--ink);font-family:var(--f-mono)}
.grid .rm{position:sticky;left:0;z-index:2;background:var(--surface);min-width:96px;width:96px;padding:4px 10px;text-align:left}
.grid thead .rm{z-index:3;background:var(--surface-2)}
.rm .no{font-family:var(--f-mono);font-weight:500;font-size:15px;display:flex;align-items:center;gap:6px}
.rm .ty{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.hk{width:8px;height:8px;border-radius:50%;display:inline-block}
.hk.clean{background:var(--in)} .hk.dirty{background:var(--warn)} .hk.repair{background:var(--bad)} .hk.cleaning{background:var(--booked)} .hk.inspect{background:var(--insp)}
.legend i.hk{width:12px;height:12px;border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--muted)} .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .chip.ghost{background:none;color:var(--muted)}
.chip:focus-visible,.hk-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips .range{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.chips .range input{width:70px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
.hkb.dirty{color:var(--warn);border-color:var(--warn)} .hkb.cleaning{color:var(--booked);border-color:var(--booked)} .hkb.inspect{color:var(--insp);border-color:var(--insp)} .hkb.clean{background:var(--in);color:#fff;border-color:var(--in)} .hkb.repair{color:var(--bad);border-color:var(--bad)}
.hk-bar{margin-top:16px} .hk-bar h2{margin-bottom:8px}
.hk-floor{margin:18px 0 8px;padding:8px 12px;border-radius:8px;background:var(--floor-bg);color:var(--floor-ink);font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-left:4px solid var(--floor-ink)}
.hk-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.hk-card{display:flex;flex-direction:column;gap:2px;text-align:left;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);cursor:pointer;min-width:0;border-left-width:6px}
.hk-card .n{font-family:var(--f-mono);font-size:18px;font-weight:500;color:var(--ink)} .hk-card .s{font-size:12px;font-weight:700} .hk-card .w,.hk-card .t{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hk-card.clean{border-left-color:var(--in)} .hk-card.clean .s{color:var(--in)}
.hk-card.dirty{border-left-color:var(--warn);background:var(--warn-bg)} .hk-card.dirty .s{color:var(--warn)}
.hk-card.cleaning{border-left-color:var(--booked);background:var(--booked-bg)} .hk-card.cleaning .s{color:var(--booked)}
.hk-card.inspect{border-left-color:var(--insp);background:var(--insp-bg)} .hk-card.inspect .s{color:var(--insp)}
.hk-card.repair{border-left-color:var(--bad);background:var(--bad-bg)} .hk-card.repair .s{color:var(--bad)}
.hk-card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)} .hk-card.sel .n::after{content:" ✓";color:var(--accent)}
.stat.hk-st{border-left:5px solid var(--line)} .stat.hk-st.dirty{border-left-color:var(--warn)} .stat.hk-st.cleaning{border-left-color:var(--booked)} .stat.hk-st.inspect{border-left-color:var(--insp)} .stat.hk-st.clean{border-left-color:var(--in)}
.pill.hkp.dirty{background:var(--warn-bg);color:var(--warn)} .pill.hkp.cleaning{background:var(--booked-bg);color:var(--booked)} .pill.hkp.inspect{background:var(--insp-bg);color:var(--insp)} .pill.hkp.done{background:var(--in-bg);color:var(--in)} .pill.hkp.cancelled{background:var(--out-bg);color:var(--out)}
.warnbox{background:var(--warn-bg);color:var(--warn)}
.grid tr.floor td{height:34px;background:var(--floor-bg);color:var(--floor-ink);font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:0 12px;font-weight:700;border-top:2px solid var(--floor-ink);border-bottom:2px solid var(--floor-ink)}
.grid tr.floor td.rm{background:var(--floor-bg);font-family:var(--f-display);font-weight:700;white-space:nowrap}
.grid thead th.nav{width:34px;min-width:34px;padding:0}
.grid thead th.nav button{width:100%;height:100%;min-height:52px;border:0;background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.grid thead th.nav button:hover{background:var(--accent);color:var(--accent-ink)}
.grid td.g-free{background:var(--in-bg);color:var(--in);font-size:11px;font-weight:600;text-align:center} .grid td.g-x{background:var(--surface-2)}
.grid td.navpad{width:34px;min-width:34px;background:var(--surface-2)}
.grid .we{background:var(--weekend)}
.grid .td{background:var(--today)}
.cell-empty{cursor:pointer}
.cell-empty:hover{background:var(--accent-soft)}
.cell-empty.ro{cursor:default}.cell-empty.ro:hover{background:inherit}
.bar{display:flex;align-items:center;gap:4px;margin:5px 3px;height:34px;padding:0 8px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;overflow:hidden;white-space:nowrap;border:0;width:calc(100% - 6px);text-align:left}
.bar span{overflow:hidden;text-overflow:ellipsis}
.bar.booked{background:var(--booked-bg);color:var(--booked);box-shadow:inset 3px 0 0 var(--booked)}
.bar.in{background:var(--in-bg);color:var(--in);box-shadow:inset 3px 0 0 var(--in)}
.bar.out{background:var(--out-bg);color:var(--out);box-shadow:inset 3px 0 0 var(--out)}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0;box-shadow:none}
.bar .debt{flex:none;width:7px;height:7px;border-radius:50%;background:var(--bad)}

/* cards & lists */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--tc,var(--accent));margin:0 0 12px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-left:10px;border-left:4px solid var(--tc,var(--accent))}
.panel{border-top:3px solid color-mix(in srgb,var(--tc,var(--accent)) 55%,transparent)}
.panel h2 b{font-family:var(--f-mono);color:var(--ink);letter-spacing:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:var(--f-display);font-size:24px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:160px;cursor:pointer}
.row .main b{display:block}
.row .sub{font-size:13px;color:var(--muted)}
.room-tag{font-family:var(--f-mono);font-weight:500;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:14px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}

const BF={roomId:'Номер',status:'Статус',checkIn:'Заезд',checkOut:'Выезд',guest:'Гость',phone:'Телефон',guests:'Гостей',doc:'Документ',source:'Источник',price:'Цена/ночь',paid:'Оплачено',payMethod:'Способ оплаты',company:'Компания',note:'Комментарий'};

function fmtB(k,v){if(k==='roomId')return roomNo(v);if(k==='status')return STATUS[v]||v;if(k==='checkIn'||k==='checkOut')return human(v);if(k==='price'||k==='paid')return tg(v);return v??''}

function changes(prev,next,FL,fmt){if(!prev)return[];const out=[];for(const k in FL){const a=prev[k]??'',b=next[k]??'';if(String(a)!==String(b))out.push({f:FL[k],from:String(fmt(k,a)),to:String(fmt(k,b))})}return out}

const TS=()=>firebase.firestore.FieldValue.serverTimestamp();

async function writeBooking(prev,data,action){
  const bref=prev?fdb.collection('bookings').doc(prev.id):fdb.collection('bookings').doc();
  const lref=fdb.collection('log').doc();
  const body=Object.assign({},data,{lastLog:lref.id,updatedBy:me.email,updatedByName:me.name,updatedAt:TS(),
    createdBy:prev?(prev.createdBy||null):me.email,createdByName:prev?(prev.createdByName||null):me.name,createdAt:prev?(prev.createdAt||null):TS()});
  const ch=changes(prev,data,BF,fmtB);
  const entry={at:TS(),by:me.email,byName:me.name,kind:'booking',action,target:bref.id,room:roomNo(data.roomId),guest:data.guest||'',
    text:`${VERB[action]}: №${roomNo(data.roomId)}, ${data.guest||'без имени'}, ${human(data.checkIn)}–${human(data.checkOut)}, ${tg(nights(data)*(+data.price||0))}`,changes:ch,payment:ch.some(c=>c.f==='Оплачено')};
  const b=fdb.batch();b.set(lref,entry);b.set(bref,body);b.set(fdb.collection('occ').doc(bref.id),{roomId:data.roomId,checkIn:data.checkIn,checkOut:data.checkOut,status:data.status});await b.commit();
}
async function deleteBooking(bk){
  const lref=fdb.collection('log').doc();
  const entry={at:TS(),by:me.email,byName:me.name,kind:'booking',action:'delete',target:bk.id,room:roomNo(bk.roomId),guest:bk.guest||'',
    text:`${VERB.delete}: №${roomNo(bk.roomId)}, ${bk.guest||'без имени'}, ${human(bk.checkIn)}–${human(bk.checkOut)}, ${tg(total(bk))}, оплачено ${tg(bk.paid)}`,changes:[],payment:false,snapshot:pick(bk,BF)};
  const b=fdb.batch();b.set(lref,entry);b.delete(fdb.collection('bookings').doc(bk.id));b.delete(fdb.collection('occ').doc(bk.id));await b.commit();

async function writeRoom(prev,data,action,id){

  tabsEl.innerHTML=vis.map(([k,l])=>`<button data-tab="${k}" aria-selected="${k===st.tab}">${l}${k==='staff'&&newRegs().length?` <span class="pill debt">${newRegs().length}</span>`:''}</button>`).join('');

function bRow(b,actions=''){const r=roomById(b.roomId)||{};
  return `<div class="row"><span class="room-tag">${esc(r.number||'?')}</span><div class="main" data-act="openb" data-id="${b.id}"><b>${esc(b.guest||'Без имени')}</b><div class="sub">${human(b.checkIn)} → ${human(b.checkOut)} · ${nights(b)} н. ${b.phone?'· '+esc(b.phone):''}</div></div>${debt(b)>0?`<span class="pill debt">долг ${tg(debt(b))}</span>`:''}${actions}</div>`}
function vToday(){

    <div class="stat"><div class="k">Свободно</div><div class="v">${free.length}</div><div class="s">${free.filter(r=>r.hk&&r.hk!=='clean').length} из них не готовы</div></div>

  h+=`<section class="panel"><h2>Заезды сегодня <b>${arr.length}</b></h2><div class="list">${arr.map(b=>bRow(b,B(b.id,'checkin','Заселить'))).join('')||'<div class="muted">Заездов нет</div>'}</div></section>`;

function vList(){
  const q=st.q.trim().toLowerCase();
  const needAll=st.filter!=='active'||q;
  if(needAll&&!hist)loadHist();
  const src=needAll?allB():bookings;
  let xs=src.filter(b=>{
    if(st.filter==='active'&&!(live(b)&&b.status!=='out'))return false;
    if(st.filter==='debt'&&!(live(b)&&debt(b)>0))return false;
    if(st.filter==='cancelled'&&b.status!=='cancelled')return false;
    if(!q)return true;const r=roomById(b.roomId)||{};
    return[b.guest,b.phone,r.number,b.note,b.company,ref(b.id)].join(' ').toLowerCase().includes(q)});
  xs.sort((a,b)=>st.filter==='active'?a.checkIn.localeCompare(b.checkIn):b.checkIn.localeCompare(a.checkIn));
  let h=`<div class="toolbar"><input type="search" id="l-q" placeholder="Имя, телефон, номер, компания…" value="${esc(st.q)}" style="flex:1;min-width:180px">
    <select id="l-f">${[['active','Текущие и будущие'],['all','Все'],['debt','С долгом'],['cancelled','Отменённые']].map(([k,l])=>`<option value="${k}"${st.filter===k?' selected':''}>${l}</option>`).join('')}</select>
    ${can.book()?'<button class="btn" data-act="finder">Подобрать номер</button><button class="btn primary" data-act="newb">+ Бронь</button>':''}</div>`;

function periodStats(list,from,toEx){
  let rev=0,nts=0;const bySrc={},byType={},byRoom={};
  list.filter(b=>live(b)&&b.checkIn<toEx&&b.checkOut>from).forEach(b=>{
    const a=b.checkIn>from?b.checkIn:from,e=b.checkOut<toEx?b.checkOut:toEx,n=Math.max(0,diffD(a,e)),v=n*(+b.price||0);rev+=v;nts+=n;
    const s=b.source||'Другое';bySrc[s]=(bySrc[s]||0)+v;const r=roomById(b.roomId)||{};const t=r.type||'—';byType[t]=(byType[t]||0)+v;
    byRoom[b.roomId]=byRoom[b.roomId]||{n:0,v:0};byRoom[b.roomId].n+=n;byRoom[b.roomId].v+=v});
  const arrivals=list.filter(b=>live(b)&&b.checkIn>=from&&b.checkIn<toEx);let paid=0,owe=0;const byPay={};
  arrivals.forEach(b=>{paid+=+b.paid||0;owe+=debt(b);const p=b.payMethod||'—';byPay[p]=(byPay[p]||0)+(+b.paid||0)});
  const rs=sortedRooms(),days=diffD(from,toEx),occ=rs.length&&days?Math.round(nts/(rs.length*days)*100):0;
  return{rev,nts,bySrc,byType,byRoom,byPay,paid,owe,occ,adr:nts?rev/nts:0,days,arrivals};
}

  if(k==='w')return[add(t,-6),t];if(k==='w10')return[add(t,-9),t];if(k==='m')return[ym+'-01',t];

async function fetchLog(from,toEx){

const blocks=b=>b.status==='booked'||b.status==='in';
const clash=(list,roomId,ci,co,exceptId)=>list.find(x=>x.id!==exceptId&&blocks(x)&&x.roomId===roomId&&x.checkIn<co&&ci<x.checkOut);
async function serverClash(roomId,ci,co,exceptId){

}

}

let maids=[],openTasks=[],hkSel=new Set(),hkBusy=false,hkRep=null,hkRepLoading=false;
const OPEN_HK=['dirty','cleaning','inspect'];
const maidName=m=>m?[m.first,m.last].filter(Boolean).join(' '):'';
const maidById=id=>maids.find(m=>m.id===id);
const taskById=id=>openTasks.find(t=>t.id===id);
const hhmm=ms=>{if(!ms)return'';const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const dmyhm=ms=>{if(!ms)return'';const d=new Date(ms);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+' '+hhmm(ms)};
const mins=(a,b)=>a&&b?Math.max(0,Math.round((b-a)/60000)):null;
const HKACT={dirty:'Нужна уборка',start:'Начала уборку',ready:'Готово — на проверку',accept:'Принято',ret:'Вернуть на доуборку',repair:'Ремонт',assign:'Назначена горничная'};

async function hkOne(r,action,maidId){
  const now=Date.now(),cur=r.hk||'clean',tk=r.hkTask?taskById(r.hkTask):null;
  const m=maidId?maidById(maidId):null;
  const tc=fdb.collection('cleanings');let tref=tk?tc.doc(tk.id):null,task=null,room={},text='';
  const ev=s=>({s,at:now,by:me.email,byName:me.name,maid:m?maidName(m):(tk&&tk.maidName)||''});
  const newTask=(status)=>{tref=tc.doc();return{roomId:r.id,room:String(r.number),floor:r.floor,status,maidId:m?m.id:'',maidName:m?maidName(m):'',t0:now,createdBy:me.email,createdByName:me.name,
    assignedAt:m?now:null,startedAt:status==='cleaning'?now:null,readyAt:null,doneAt:null,doneBy:'',doneByName:'',returns:0,events:[ev(status==='cleaning'?'start':'dirty')]}};
  const evs=x=>((tk&&tk.events)||[]).concat([x]);
  if(action==='dirty'||action==='assign'){
    if(tk&&OPEN_HK.includes(cur)){if(!m)return 'skip';task={maidId:m.id,maidName:maidName(m),assignedAt:now,events:evs(ev('assign'))};room={hk:cur};text=`назначена ${maidName(m)}`}
    else{if(action==='assign'&&!m)return 'skip';task=newTask('dirty');room={hk:'dirty'};text=HKACT.dirty+(m?' → '+maidName(m):'')}
  }else if(action==='start'){
    if(cur==='cleaning')return 'skip';
    if(!tk||!OPEN_HK.includes(cur)){if(!m)return 'nomaid';task=newTask('cleaning');}
    else{const mid=m?m.id:tk.maidId;if(!mid)return 'nomaid';const mm=maidById(mid);task={status:'cleaning',startedAt:tk.startedAt||now,maidId:mid,maidName:mm?maidName(mm):tk.maidName,assignedAt:tk.assignedAt||now,events:evs(ev('start'))}}
    room={hk:'cleaning'};text=HKACT.start;
  }else if(action==='ready'){
    if(!tk||!['dirty','cleaning'].includes(cur))return 'skip';
    const mid=m?m.id:tk.maidId;if(!mid)return 'nomaid';const mm=maidById(mid);
    task={status:'inspect',readyAt:now,startedAt:tk.startedAt||tk.assignedAt||tk.t0,maidId:mid,maidName:mm?maidName(mm):tk.maidName,events:evs(ev('ready'))};room={hk:'inspect'};text=HKACT.ready;
  }else if(action==='accept'){
    if(cur==='clean')return 'skip';
    if(tk&&OPEN_HK.includes(cur)){if(cur!=='inspect'&&!can.manage())return 'notready';task={status:'done',doneAt:now,doneBy:me.email,doneByName:me.name,readyAt:tk.readyAt||now,events:evs(ev('accept'))}}
    room={hk:'clean',hkTask:null,hkMaid:'',hkMaidName:''};text=HKACT.accept;
  }else if(action==='ret'){
    if(!tk||cur!=='inspect')return 'skip';
    task={status:'cleaning',readyAt:null,returns:(tk.returns||0)+1,events:evs(ev('return'))};room={hk:'cleaning'};text=HKACT.ret;
  }else if(action==='repair'){
    if(cur==='repair')return 'skip';
    if(tk&&OPEN_HK.includes(cur))task={status:'cancelled',events:evs(ev('repair'))};
    room={hk:'repair',hkTask:null,hkMaid:'',hkMaidName:''};text=HKACT.repair;
  }
  if(task&&tref&&room.hkTask!==null){room.hkTask=tref.id;room.hkMaid=task.maidId!==undefined?task.maidId:(tk&&tk.maidId)||'';room.hkMaidName=task.maidName!==undefined?task.maidName:(tk&&tk.maidName)||''}
  room.hkAt=now;
  const lref=fdb.collection('log').doc();const b=fdb.batch();
  b.set(lref,{at:TS(),by:me.email,byName:me.name,kind:'hk',action:'hk-'+action,target:r.id,room:String(r.number),guest:'',text:`Уборка №${r.number}: ${text}`,changes:[{f:'Состояние',from:HK[cur]||cur,to:HK[room.hk]||room.hk}],payment:false});
  if(task&&tref)b.set(tref,task,{merge:true});
  b.set(fdb.collection('rooms').doc(r.id),Object.assign(room,{lastLog:lref.id,updatedBy:me.email,updatedAt:TS()}),{merge:true});
  await b.commit();return 'ok';
}
async function hkApply(ids,action,maidId,quiet){
  if(hkBusy)return;hkBusy=true;let ok=0,skip=0,nomaid=0,nr=0;
  try{for(const id of ids){const r=roomById(id);if(!r)continue;const res=await hkOne(r,action,maidId);if(res==='ok')ok++;else if(res==='nomaid')nomaid++;else if(res==='notready')nr++;else skip++}}
  catch(e){toast('Не удалось: '+errText(e))}
  hkBusy=false;
  if(!quiet){let msg=ok?`${HKACT[action]}: ${ok} ном.`:'Ничего не изменено';
    if(nomaid)msg+=` · ${nomaid} без горничной — выберите горничную`;
    if(nr)msg+=` · ${nr} ещё не готовы — сначала «Готово»`;
    if(skip&&!ok)msg+=' — для выбранных номеров это действие не подходит';
    toast(msg);if(ok){hkSel.clear();render()}}
}

  const by={};hkRep.forEach(t=>{const k=t.maidName||'— не назначена —';const o=by[k]=by[k]||{n:0,done:0,mins:[],ret:0,rooms:[]};o.n++;if(t.status==='done')o.done++;o.ret+=t.returns||0;const d=mins(t.startedAt||t.assignedAt,t.readyAt);if(d!==null)o.mins.push(d);o.rooms.push(t.room)});
  h+=`<div class="tbl"><table class="data"><thead><tr><th>Горничная</th><th class="r">Заданий</th><th class="r">Принято</th><th class="r">Ср. время</th><th class="r">Возвратов</th><th>Номера</th></tr></thead><tbody>${Object.entries(by).sort((a,b)=>b[1].done-a[1].done).map(([k,o])=>`<tr><td><b>${esc(k)}</b></td><td class="r">${o.n}</td><td class="r">${o.done}</td><td class="r">${o.mins.length?Math.round(o.mins.reduce((a,b)=>a+b,0)/o.mins.length)+' мин':'—'}</td><td class="r">${o.ret}</td><td style="font-size:13px">${esc(o.rooms.join(', '))}</td></tr>`).join('')}</tbody></table></div>
  <h2 style="margin-top:16px">История <b>${hkRep.length}</b></h2><div class="tbl"><table class="data"><thead><tr><th>№</th><th>Горничная</th><th>Задание</th><th>Начала</th><th>Готово</th><th>Принято</th><th class="r">Мин</th><th class="r">Возвр.</th><th>Статус</th></tr></thead><tbody>${hkRep.map(t=>`<tr><td><span class="room-tag">${esc(t.room)}</span></td><td>${esc(t.maidName||'—')}</td><td style="font-size:13px">${dmyhm(t.t0)}<div class="muted">${esc(t.createdByName||'')}</div></td><td style="font-size:13px">${hhmm(t.startedAt)||'—'}</td><td style="font-size:13px">${hhmm(t.readyAt)||'—'}</td><td style="font-size:13px">${t.doneAt?dmyhm(t.doneAt):'—'}<div class="muted">${esc(t.doneByName||'')}</div></td><td class="r">${mins(t.startedAt||t.assignedAt,t.readyAt)??'—'}</td><td class="r">${t.returns||0}</td><td><span class="pill hkp ${t.status}">${HKT[t.status]||t.status}</span></td></tr>`).join('')}</tbody></table></div></section>`;
  return h;
}
const HKT={dirty:'Ждёт',cleaning:'Убирается',inspect:'На проверке',done:'Принято',cancelled:'Отменено'};
async function loadHkReport(){hkRepLoading=true;render();
  try{const from=new Date(st.hkFrom+'T00:00:00').getTime(),to=new Date(add(st.hkTo,1)+'T00:00:00').getTime();
    const s=await fdb.collection('cleanings').where('t0','>=',from).where('t0','<',to).orderBy('t0','desc').limit(1000).get();hkRep=s.docs.map(d=>({id:d.id,...d.data()}))}
  catch(e){hkRep=[];toast('Не удалось загрузить отчёт: '+errText(e))}
  hkRepLoading=false;render()}
function hkXls(){
  const by={};hkRep.forEach(t=>{const k=t.maidName||'— не назначена —';const o=by[k]=by[k]||{n:0,done:0,mins:[],ret:0,rooms:[]};o.n++;if(t.status==='done')o.done++;o.ret+=t.returns||0;const d=mins(t.startedAt||t.assignedAt,t.readyAt);if(d!==null)o.mins.push(d);o.rooms.push(t.room)});
  saveXlsx(`Уборка ${dmy(st.hkFrom)}-${dmy(st.hkTo)}.xlsx`,[
    ['Горничные',[['Горничная','Заданий','Принято','Среднее время, мин','Возвратов','Номера'],...Object.entries(by).map(([k,o])=>[k,o.n,o.done,o.mins.length?Math.round(o.mins.reduce((a,b)=>a+b,0)/o.mins.length):'',o.ret,o.rooms.join(', ')])]],
    ['История',[['Номер','Этаж','Горничная','Задание поставлено','Поставил(а)','Начала','Готово','Принято','Принял(а)','Минут','Возвратов','Статус'],...hkRep.map(t=>[t.room,t.floor,t.maidName||'',dmyhm(t.t0),t.createdByName||'',dmyhm(t.startedAt),dmyhm(t.readyAt),dmyhm(t.doneAt),t.doneByName||'',mins(t.startedAt||t.assignedAt,t.readyAt)??'',t.returns||0,HKT[t.status]||t.status])]]]);
}
app.addEventListener('click',async e=>{
  const el=e.target.closest('[data-hk]');if(!el||!me||!can.book())return;const a=el.dataset.hk,v=el.dataset.v;
  if(a==='toggle'){hkSel.has(v)?hkSel.delete(v):hkSel.add(v);render();return}
  if(a==='selfloor'){sortedRooms().filter(r=>String(r.floor)===v).forEach(r=>hkSel.add(r.id));render();return}
  if(a==='selst'){sortedRooms().filter(r=>(r.hk||'clean')===v).forEach(r=>hkSel.add(r.id));render();return}
  if(a==='selnone'){hkSel.clear();render();return}
  if(a==='selrange'){const f=+document.getElementById('hk-from').value,t=+document.getElementById('hk-to').value||f;if(!f){toast('Укажите номера, например с 201 по 206');return}
    const lo=Math.min(f,t),hi=Math.max(f,t);sortedRooms().filter(r=>+r.number>=lo&&+r.number<=hi).forEach(r=>hkSel.add(r.id));render();return}
  if(a==='maid'){st.hkMaid=st.hkMaid===v?'':v;render();return}
  if(a==='do'){if(!hkSel.size){toast('Сначала выберите номера');return}
    if(v==='ret'||v==='repair'){const ids=[...hkSel];ask(v==='ret'?`Вернуть на доуборку ${ids.length} ном.?`:`Отметить ремонт: ${ids.length} ном.?`,v==='ret'?'Вернуть':'Ремонт',()=>hkApply(ids,v,st.hkMaid));return}
    hkApply([...hkSel],v,st.hkMaid);return}
  if(a==='maidtoggle'){const m=maidById(v);if(!m)return;try{await fdb.collection('maids').doc(v).set({active:m.active===false},{merge:true})}catch(err){toast('Не удалось: '+errText(err))}return}
  if(a==='report'&&can.manage()){loadHkReport();return}
  if(a==='xls'&&can.manage()){hkXls();return}
});
app.addEventListener('change',e=>{if(e.target.id==='hk-rf')st.hkFrom=e.target.value;if(e.target.id==='hk-rt')st.hkTo=e.target.value});
app.addEventListener('submit',async e=>{if(e.target.id!=='own-form'||me.email!==OWNER)return;e.preventDefault();
  const p1=document.getElementById('own-p1').value,p2=document.getElementById('own-p2').value,er=document.getElementById('own-err'),btn=e.target.querySelector('button');
  const fail=t=>{er.textContent=t;er.hidden=false};if(p1.length<6)return fail('Пароль — минимум 6 символов.');if(p1!==p2)return fail('Пароли не совпадают.');
  btn.disabled=true;
  try{const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec');
    const c=await sec.auth().createUserWithEmailAndPassword(toEmail(OWNER_LOGIN),p1);await c.user.updateProfile({displayName:me.name});const uid=c.user.uid;await sec.auth().signOut();
    const b=fdb.batch();b.set(fdb.collection('config').doc('owners'),{uids:firebase.firestore.FieldValue.arrayUnion(uid),login:OWNER_LOGIN,updatedAt:TS()},{merge:true});
    b.set(fdb.collection('log').doc(),{at:TS(),by:me.email,byName:me.name,kind:'staff',action:'owner-login',target:uid,room:'',guest:'',text:'Создал(а) вход владельца по логину '+OWNER_LOGIN,changes:[],payment:false});await b.commit();
    toast('Готово! Теперь можно входить: логин '+OWNER_LOGIN+' и ваш пароль')}
  catch(err){btn.disabled=false;fail(err.code==='auth/email-already-in-use'?'Логин '+OWNER_LOGIN+' уже кем-то занят. Напишите Claude — подберём другой.':(err.code&&err.code.startsWith('auth/')?aerr(err):errText(err)))}});
app.addEventListener('submit',async e=>{if(e.target.id!=='maid-form')return;e.preventDefault();
  const first=document.getElementById('m-first').value.trim(),last=document.getElementById('m-last').value.trim();if(!first)return;
  try{await fdb.collection('maids').add({first,last,active:true,addedAt:TS(),addedBy:me.email,addedByName:me.name});e.target.reset();toast('Горничная добавлена: '+first+' '+last)}catch(err){toast('Не удалось: '+errText(err))}});

/* ---------- auth ---------- */
const EMBLEM='<img src="logo.png" alt="Jana Jybek Joly" width="270" height="180">';
const AUTHERR={'auth/invalid-credential':'Неверный логин или пароль.','auth/wrong-password':'Неверный логин или пароль.','auth/user-not-found':'Неверный логин или пароль.','auth/invalid-email':'Проверьте логин.','auth/email-already-in-use':'Такой логин уже занят. Придумайте другой.','auth/weak-password':'Пароль слишком короткий — минимум 6 символов.','auth/too-many-requests':'Слишком много попыток. Подождите несколько минут.','auth/network-request-failed':'Нет интернета. Проверьте подключение.','auth/popup-closed-by-user':'Окно входа закрыто.','auth/unauthorized-domain':'Этот адрес сайта не разрешён для входа через Google. Сообщите владельцу.','auth/account-exists-with-different-credential':'Этот email уже зарегистрирован другим способом.'};
const aerr=e=>AUTHERR[e&&e.code]||('Ошибка входа: '+((e&&e.message)||e));
function showLogin(msg){
  whoEl.innerHTML='';renderTabs();const m=st.authMode;
  app.innerHTML=`<form class="login" id="login-form" autocomplete="on"><div class="emb" aria-hidden="true">${EMBLEM}</div>
    <h2>${m==='login'?'Вход для сотрудников':'Регистрация'}</h2>
    <p>${m==='login'?'Введите логин и пароль, которые вам выдали.':'Придумайте логин и пароль. Сразу после регистрации откроется просмотр занятости номеров, остальной доступ выдаёт владелец.'}</p>
    ${m==='reg'?'<input id="a-name" placeholder="Ваше имя" autocomplete="name" required>':''}
    <input id="a-login" placeholder="${m==='login'?'Логин':'Придумайте логин (латиницей)'}" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <input id="a-pass" type="password" placeholder="${m==='reg'?'Придумайте пароль (от 6 символов)':'Пароль'}" autocomplete="${m==='reg'?'new-password':'current-password'}" required minlength="6">
    ${m==='reg'?'<input id="a-pass2" type="password" placeholder="Повторите пароль" autocomplete="new-password" required minlength="6">':''}
    <button class="btn primary" type="submit">${m==='login'?'Войти':'Зарегистрироваться'}</button>
    <div class="err" id="a-err" ${msg?'':'hidden'}>${esc(msg||'')}</div>
    ${m==='login'?'<div class="or">или</div><button type="button" class="btn" data-auth="google">Войти через Google</button>':''}
    <div class="links">${m==='login'?'<button type="button" class="linkbtn" data-auth="reg">Регистрация</button><span class="muted" style="font-size:13px">Забыли пароль — обратитесь к владельцу</span>':'<button type="button" class="linkbtn" data-auth="login">← Ко входу</button>'}</div>
  </form>`;
}
app.addEventListener('click',async e=>{const b=e.target.closest('[data-auth]');if(!b)return;const a=b.dataset.auth;
  if(a==='login'||a==='reg'){st.authMode=a;showLogin();return}
  if(a==='google'){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    try{await auth.signInWithPopup(p)}catch(err){if(err.code==='auth/popup-blocked'||err.code==='auth/operation-not-supported-in-this-environment'){await auth.signInWithRedirect(p)}else if(err.code!=='auth/cancelled-popup-request')showLogin(aerr(err))}}
  if(a==='verified'){const u=auth.currentUser;if(!u)return;await u.reload();await auth.currentUser.getIdToken(true);handleUser(auth.currentUser)}
  if(a==='resend'){try{await auth.currentUser.sendEmailVerification();toast('Письмо отправлено ещё раз')}catch(err){toast(aerr(err))}}
  if(a==='logout')auth.signOut();
});
whoEl.addEventListener('click',e=>{if(e.target.closest('[data-auth="logout"]'))auth.signOut()});
async function doAuth(){
  const raw=(document.getElementById('a-login').value||'').trim().toLowerCase(),pw=document.getElementById('a-pass').value||'',er=document.getElementById('a-err');
  const fail=t=>{er.textContent=t;er.hidden=false};
  try{
    if(st.authMode==='login'){await auth.signInWithEmailAndPassword(toEmail(raw),pw)}
    else{
      const name=document.getElementById('a-name').value.trim();
      if(!name)return fail('Укажите имя.');
      if(raw.includes('@')||!LOGIN_RE.test(raw))return fail('Логин: от 3 до 30 латинских букв или цифр, можно точку, дефис и _.');
      if(raw===OWNER_LOGIN)return fail('Такой логин уже занят. Придумайте другой.');
      if(pw!==document.getElementById('a-pass2').value)return fail('Пароли не совпадают.');
      const em=toEmail(raw);pendingReg={em,name,login:raw,password:pw};
      const c=await auth.createUserWithEmailAndPassword(em,pw);await c.user.updateProfile({displayName:name});
    }
  }catch(err){pendingReg=null;fail(aerr(err))}
}
function showVerify(u){whoEl.innerHTML=`<button class="linkbtn" data-auth="logout">Выйти</button>`;renderTabs();
  app.innerHTML=`<div class="login"><h2>Подтвердите email</h2><p>Мы отправили письмо на <b>${esc(u.email)}</b>. Откройте его и перейдите по ссылке. Если письма нет — проверьте папку «Спам».</p>
  <button class="btn primary" data-auth="verified">Я подтвердил(а)</button><button class="btn" data-auth="resend">Отправить письмо ещё раз</button><button class="btn" data-auth="logout">Выйти</button></div>`}
function showNoAccess(em,kind){whoEl.innerHTML=`<button class="linkbtn" data-auth="logout">Выйти</button>`;renderTabs();
  const id=esc(showId(em));
  const txt=kind==='off'?`Доступ для <b>${id}</b> отключён владельцем.`:kind==='pending'?`Заявка от <b>${id}</b> отправлена владельцу. Когда он её одобрит, нажмите «Проверить снова».`:`Аккаунт <b>${id}</b> не добавлен в сотрудники. Обратитесь к владельцу.`;
  app.innerHTML=`<div class="login"><h2>${kind==='pending'?'Заявка отправлена':'Нет доступа'}</h2><p>${txt}</p>
  <button class="btn primary" data-auth="verified">Проверить снова</button><button class="btn" data-auth="logout">Выйти</button></div>`}
let hbTimer=null,refreshTimer=null;
function stopSubs(){clearInterval(hbTimer);hbTimer=null;subs.forEach(f=>{try{f()}catch(e){}});subs=[];rooms=[];bookings=[];hist=null;staffList=[];occ=[];creds={};maids=[];openTasks=[];hkSel=new Set();hkRep=null;logs=null;loaded={r:false,b:false}}
async function handleUser(u){
  stopSubs();me=null;close();
  if(!u){showLogin();return}
  const em=(u.email||'').toLowerCase();
  if(!em){showNoAccess('—');return}
  if(!isInternal(em)&&!u.emailVerified){showVerify(u);return}
  let isMain=em===OWNER;
  if(!isMain&&isInternal(em)){try{const o=await fdb.collection('config').doc('owners').get();if(o.exists&&(o.data().uids||[]).includes(u.uid))isMain=true}catch(e){}}
  let role=isMain?'owner':null,name=isMain?(u.displayName||'Главный владелец'):(u.displayName||showId(em));
  if(!isMain){
    try{let s=await fdb.collection('staff').doc(em).get();
      if(!s.exists&&isInternal(em)&&pendingReg&&pendingReg.em===em){
        const p=pendingReg;pendingReg=null;const b=fdb.batch();
        b.set(fdb.collection('staff').doc(em),{name:p.name,role:'novice',active:true,self:true,login:p.login,addedAt:TS(),lastSeen:TS()});
        b.set(fdb.collection('creds').doc(em),{login:p.login,password:p.password,name:p.name,at:TS()});
        b.set(fdb.collection('log').doc(),{at:TS(),by:em,byName:p.name,kind:'staff',action:'register',target:em,room:'',guest:'',text:`Зарегистрировался(ась) сам(а): ${p.name} (${p.login}) — Гость`,changes:[],payment:false});
        await b.commit();s=await fdb.collection('staff').doc(em).get()}
      if(s.exists){const d=s.data();if(d.name)name=d.name;if(d.active===false||d.deleted){showNoAccess(em,'off');return}role=d.role;
        const beat=()=>{if(document.visibilityState==='visible')fdb.collection('staff').doc(em).update({lastSeen:TS()}).catch(()=>{})};beat();
        hbTimer=setInterval(beat,90*1000);document.addEventListener('visibilitychange',beat)}
    }catch(e){console.error(e)}
  }
  if(!role){showNoAccess(em);return}
  me={email:em,name,role};
  whoEl.innerHTML=`<span><b>${esc(name)}</b></span><span class="role">${ROLES[role]}</span><button class="linkbtn" data-auth="logout">Выйти</button>`;
  render();
  const onErr=e=>{if(e.code==='permission-denied')app.innerHTML='<div class="notice">Нет доступа к данным. Попросите владельца проверить вашу роль.</div>';else toast('Связь с базой прервана — обновите страницу')};
  subs.push(fdb.collection('rooms').onSnapshot(s=>{rooms=s.docs.map(x=>({id:x.id,...x.data()}));loaded.r=true;render()},onErr));
  if(['owner','manager','admin'].includes(role)){subs.push(fdb.collection('maids').onSnapshot(s=>{maids=s.docs.map(x=>({id:x.id,...x.data()}));if(st.tab==='hk')render()},()=>{}));
    subs.push(fdb.collection('cleanings').where('status','in',['dirty','cleaning','inspect']).onSnapshot(s=>{openTasks=s.docs.map(x=>({id:x.id,...x.data()}));if(st.tab==='hk')render()},()=>{}))}
  if(role==='novice'){subs.push(fdb.collection('occ').where('checkOut','>=',liveFrom()).onSnapshot(s=>{occ=s.docs.map(x=>({id:x.id,...x.data()}));render()},onErr));return}
  subs.push(fdb.collection('bookings').where('checkOut','>=',liveFrom()).onSnapshot(s=>{bookings=s.docs.map(x=>({id:x.id,...x.data()}));if(hist){const ids=new Set(bookings.map(b=>b.id));s.docChanges().forEach(c=>{if(c.type==='removed'&&!ids.has(c.doc.id))hist=hist.filter(h=>h.id!==c.doc.id)})}loaded.b=true;render()},onErr));
  if(can.manage())subs.push(fdb.collection('staff').onSnapshot(s=>{staffList=s.docs.map(x=>({id:x.id,...x.data()}));renderTabs();if(st.tab==='staff'||st.tab==='log')render()},()=>{}));
  clearInterval(refreshTimer);if(can.owner())refreshTimer=setInterval(()=>{if(st.tab==='staff'&&!mroot.innerHTML&&!document.activeElement.closest('form'))render()},30000);
  if(em===OWNER)subs.push(fdb.collection('config').doc('owners').onSnapshot(d=>{ownerCfg=d.exists?d.data():null;if(st.tab==='staff')render()},()=>{}));
  if(can.owner()){subs.push(fdb.collection('creds').onSnapshot(s=>{creds={};s.docs.forEach(x=>creds[x.id]=x.data());if(st.tab==='staff')render()},()=>{}));
    let synced=false;subs.push(fdb.collection('occ').where('checkOut','>=',liveFrom()).onSnapshot(async s=>{if(synced||!loaded.b)return;synced=true;
      const have=new Map(s.docs.map(x=>[x.id,x.data()]));const b=fdb.batch();let n=0;
      bookings.forEach(bk=>{const o=have.get(bk.id);if(!o||o.status!==bk.status||o.checkIn!==bk.checkIn||o.checkOut!==bk.checkOut||o.roomId!==bk.roomId){b.set(fdb.collection('occ').doc(bk.id),{roomId:bk.roomId,checkIn:bk.checkIn,checkOut:bk.checkOut,status:bk.status});n++}});
      if(n)try{await b.commit()}catch(e){console.error(e)}},()=>{}))}
}

/* ---------- boot ---------- */
if(!window.firebase){app.innerHTML='<div class="notice">Не удалось загрузить систему. Проверьте интернет и обновите страницу.</div>';return}
firebase.initializeApp(FIREBASE_CONFIG);
auth=firebase.auth();auth.languageCode='ru';
fdb=firebase.firestore();
try{fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
auth.getRedirectResult().catch(err=>showLogin(aerr(err)));
auth.onAuthStateChanged(u=>handleUser(u));
})();

</script>
